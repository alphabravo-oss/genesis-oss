{{- if and .Values.bbtests.enabled .Values.bbtests.scripts.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-script-test
  labels:
    helm-test: enabled
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-script-test
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-script-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
