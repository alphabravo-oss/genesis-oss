{{- if and .Values.bbtests.enabled .Values.bbtests.scripts.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-script-test
  labels:
    helm-test: enabled
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
{{- end }}
