domain: dev.bigbang.mil

# bb-common istio configuration
istio:
  enabled: false
  injection: "enabled"

  # Mutual TLS configuration
  mtls:
    mode: STRICT  # STRICT, PERMISSIVE, or DISABLE

  # Sidecar configuration for outbound traffic control
  sidecar:
    enabled: true
    outboundTrafficPolicyMode: REGISTRY_ONLY  # REGISTRY_ONLY or ALLOW_ANY

  # Custom AuthorizationPolicies
  authorizationPolicies:
    enabled: false
    generateFromNetpol: true

# bb-common routes configuration
routes:
  inbound:
    # NeuVector web UI route
    neuvector:
      enabled: true
      gateways:
      - istio-system/public
      hosts:
      - neuvector.{{ .Values.domain }}
      service: neuvector-service-webui
      port: 8443
      selector:
        app: neuvector-manager-pod

# bb-common network policies configuration
networkPolicies:
  enabled: false

  egress:
    from:
      # Controller egress to Kubernetes API
      controller:
        podSelector:
          matchLabels:
            app: neuvector-controller-pod
        to:
          definition:
            kubeAPI: true

      # Adapter egress to Kubernetes API
      adapter:
        podSelector:
          matchLabels:
            app: neuvector-registry-adapter-pod
        to:
          definition:
            kubeAPI: true

      # Updater egress to Kubernetes API
      updater:
        podSelector:
          matchLabels:
            app: neuvector-updater-pod
        to:
          definition:
            kubeAPI: true

      # Cert upgrader egress to Kubernetes API
      cert-upgrader:
        podSelector:
          matchLabels:
            app: neuvector-cert-upgrader-pod
        to:
          definition:
            kubeAPI: true

      # Enforcer egress to Kubernetes API
      enforcer:
        podSelector:
          matchLabels:
            app: neuvector-enforcer-pod
        to:
          definition:
            kubeAPI: true

      # Scanner egress to Kubernetes API
      scanner:
        podSelector:
          matchLabels:
            app: neuvector-scanner-pod
        to:
          definition:
            kubeAPI: true

  # Ingress policies
  ingress:
    to:
      # Prometheus exporter ingress from monitoring on port 8068
      exporter:8068:
        podSelector:
          matchLabels:
            app: neuvector-prometheus-exporter-pod
        from:
          k8s:
            monitoring/prometheus: true

monitoring:
  enabled: false
  namespace: monitoring

# Bigbang helm test values default disabled
bbtests:
  enabled: false
  updater:
    enabled: false
  cypress:
    artifacts: true
    envs:
      cypress_url: "http://neuvector-service-webui.{{ .Release.Namespace }}.svc.cluster.local:8443"
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  scripts:
    envs:
      URL: "http://neuvector-service-webui.{{ .Release.Namespace }}.svc.cluster.local:8443"

# -- Values to pass to [the upstream NeuVector core subchart](https://github.com/neuvector/neuvector-helm/blob/master/charts/core/values.yaml)
# @default -- Upstream chart values for Neuvector core

upstream:
  nameOverride: neuvector
  fullnameOverride: neuvector-neuvector
  bootstrapPassword: changeme$! # neuvector enforces a mandatory password change on first login

  registry: registry1.dso.mil
  imagePullSecrets: private-registry
  tag: 5.6.0
  crdwebhook:
    enabled: false

  controller:
    # If false, controller will not be installed
    enabled: true
    image:
      repository: ironbank/neuvector/neuvector/controller
      imagePullPolicy: Always
    podAnnotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "18500"
    containerSecurityContext:
      privileged: true
      runAsUser: 1000
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
    certupgrader:
      imagePullPolicy: Always
      podAnnotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "18500"
        traffic.sidecar.istio.io/excludeOutboundPorts: "18500"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
    apisvc:
      type: ClusterIP
    prime:
      image:
        tag: 5.4.8

  enforcer:
    image:
      repository: ironbank/neuvector/neuvector/enforcer
      imagePullPolicy: Always
    podAnnotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "18500"
    containerSecurityContext:
      privileged: true
      runAsGroup: 1000
      capabilities:
        drop:
        - ALL

  manager:
    image:
      repository: ironbank/neuvector/neuvector/manager
      imagePullPolicy: Always
    env:
      ssl: false
    podAnnotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "18500"
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  cve:
    adapter:
      image:
        repository: ironbank/opensource/neuvector/registry-adapter
        tag: v0.2.9
      podAnnotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "18500"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
    updater:
      image:
        registry: "registry1.dso.mil"
        repository: ironbank/big-bang/base
        tag: 2.1.0
        imagePullPolicy: Always
      podAnnotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "18500"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
    scanner:
      image:
        repository: ironbank/neuvector/neuvector/scanner
      podAnnotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "18500"
      securityContext:
        runAsUser: 1000  # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
        runAsGroup: 1000 # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
        fsGroup: 1000  # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
        runAsNonRoot: true # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
      containerSecurityContext:
        runAsUser: 1000  # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
        runAsGroup: 1000  # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
        runAsNonRoot: true # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
        capabilities:
          drop:  # VALIDATE: not found in core (no default, no template reference) — confirm, then remove
          - ALL

# Monitor subchart:
# From https://github.com/neuvector/neuvector-helm/blob/master/charts/monitor/values.yaml
monitor:
  imagePullSecrets: private-registry
  install: false
  serviceAccount: default
  registry: registry1.dso.mil

  exporter:
    enabled: false
    serviceMonitor:
      enabled: false
    svc:
      enabled: false
    image:
      repository: ironbank/neuvector/neuvector/prometheus-exporter
      tag: 1-1.0.0
      imagePullPolicy: Always
    containerSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      capabilities:
        drop:
        - ALL
