{{- if dig "bbtests" "enabled" false (merge .Values dict) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-bbtest-binding
  labels:
    app: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    kyverno-policies-bbtest/test: required
    kyverno-policies-bbtest/required: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-bbtest-role
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-script-sa
  namespace: {{ .Release.Namespace }}
{{- end }}
