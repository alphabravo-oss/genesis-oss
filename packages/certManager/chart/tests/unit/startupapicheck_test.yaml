# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: cert-manager startupapicheck defaults
templates:
  - charts/upstream/templates/startupapicheck-job.yaml
release:
  name: cert-manager
  namespace: cert-manager
tests:
  - it: renders startupapicheck Job by default with mesh opt-outs
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: cert-manager-startupapicheck
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
      - equal:
          path: spec.template.metadata.labels["istio.io/dataplane-mode"]
          value: none

  - it: preserves Big Bang startupapicheck pod security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: does not render startupapicheck Job when disabled
    set:
      upstream.startupapicheck.enabled: false
    asserts:
      - hasDocuments:
          count: 0
