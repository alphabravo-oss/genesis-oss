apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-secrets
  annotations:
    policies.kyverno.io/title: Sync Secrets
    policies.kyverno.io/category: Test
    policies.kyverno.io/subject: Secret
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["namespaces"]
  matchConditions:
  - name: only-bbtest-namespace
    expression: "object.metadata.name == 'kyverno-bbtest'"
  evaluation:
    synchronize:
      enabled: true
  variables:
  - name: source
    expression: >-
      resource.Get("v1", "secrets", "kyverno", "kyverno-bbtest-secret")
  generate:
  - expression: >-
      generator.Apply(object.metadata.name, [variables.source])
