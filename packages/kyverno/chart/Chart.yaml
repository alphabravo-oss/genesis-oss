apiVersion: v2
type: application
name: kyverno
version: 3.8.1-bb.5
appVersion: v1.18.1
icon: https://github.com/kyverno/kyverno/raw/main/img/logo.png
description: Kubernetes Native Policy Management
home: https://kyverno.io/
sources:
  - https://github.com/kyverno/kyverno
kubeVersion: ">=1.25.0-0"
annotations:
  bigbang.dev/upstreamReleaseNotesMarkdown: |
      - [Find our upstream chart's CHANGELOG here](https://github.com/kyverno/kyverno/blob/main/CHANGELOG.md)
      - [and our upstream application release notes here](https://github.com/kyverno/kyverno/releases)
  bigbang.dev/maintenanceTrack: bb_integrated
  bigbang.dev/applicationVersions: |
    - Kyverno: v1.18.1
  # Kubectl image is used if webhooksCleanup.enable or bbtests.enabled
  helm.sh/images: |
    - name: kyverno
      image: registry1.dso.mil/ironbank/opensource/kyverno:v1.18.1
    - name: kyvernopre
      image: registry1.dso.mil/ironbank/opensource/kyverno/kyvernopre:v1.18.1
    - name: kubectl
      image: registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.35.5
    - name: reports-controller
      image: registry1.dso.mil/ironbank/opensource/kyverno/kyverno/reports-controller:v1.18.1
    - name: background-controller
      image: registry1.dso.mil/ironbank/opensource/kyverno/kyverno/background-controller:v1.18.1
    - name: cleanup-controller
      image: registry1.dso.mil/ironbank/opensource/kyverno/kyverno/cleanup-controller:v1.18.1
    - name: kyvernocli
      image: registry1.dso.mil/ironbank/opensource/kyverno/kyvernocli:v1.18.1
    - name: busybox
      image: registry1.dso.mil/ironbank/frontiertechnology/cortex/busybox:v1.37.0
    - name: readiness-checker
      image: registry1.dso.mil/ironbank/opensource/kyverno/kyverno/readiness-checker:v1.18.1
dependencies:
  - name: kyverno
    version: 3.8.1
    repository: https://kyverno.github.io/kyverno/
    alias: "upstream"
  - name: gluon
    version: 1.1.0
    repository: oci://registry1.dso.mil/bigbang
  - name: bb-common
    version: 0.14.2
    repository: "oci://registry1.dso.mil/bigbang"
