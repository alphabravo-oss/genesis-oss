## Bigbang Additions
networkPolicies:
  enabled: false
  ingress:
    defaults:
      allowPrometheusToIstioSidecar:
        enabled: false # Disabled as Kyverno is not in the service mesh
    definitions:
      kubeAPI:
        from:
          - ipBlock:
              cidr: 192.168.0.0/16
          - ipBlock:
              cidr: 172.16.0.0/12
          - ipBlock:
              cidr: 10.0.0.0/8
    to:
      kyverno-admission-controller:9443:
        podSelector:
          matchLabels:
            app.kubernetes.io/component: admission-controller
        from:
          definition:
            kubeAPI: true
      kyverno:8000:
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: kyverno-kyverno
        from:
          k8s:
            monitoring/prometheus: true
  egress:
    defaults:
      allowIstiod:
        enabled: false  # Disabled as Kyverno is not in the service mesh
    definitions:
      private-registry:
        to:
          - ipBlock:
              cidr: "15.205.173.153/32"
        ports:
          - port: 443
            protocol: TCP
    from:
      kyverno-admission-controller:
        podSelector:
          matchLabels:
            app.kubernetes.io/component: admission-controller
        to:
          definition:
            private-registry: true
            kubeAPI: true
      kyverno-migrate-resources:
        podSelector:
          matchLabels:
            batch.kubernetes.io/job-name: kyverno-kyverno-migrate-resources
        to:
          definition:
            kubeAPI: true
  # -- This section will be deprecated in the next major release in favor of the bb-common definition
  externalRegistries:
    allowEgress: false
    ports: []
    # ports:
    # - port: 1234
    #   protocol: TCP
  additionalPolicies: []
istio:
  enabled: false
openshift: false
bbtests:
  enabled: false
  scripts:
    image: registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.35.5
    additionalVolumeMounts:
      - name: "kyverno-bbtest-manifest"
        mountPath: /yaml
    additionalVolumes:
      - name: "kyverno-bbtest-manifest"
        configMap:
          name: "kyverno-bbtest-manifest"

global:
    image:
      # -- (string) Global value that allows to set a single image registry across all deployments.
      # When set, it will override any values set under `.image.registry` across the chart.
      registry: registry1.dso.mil
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: private-registry
    resyncPeriod: 15m
    templating:
      enabled: false
      debug: false
      version: ~

# -- Values to pass to [the upstream Kyverno chart](https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml)
# @default -- Upstream chart values
upstream:
  nameOverride: kyverno
  fullnameOverride: kyverno
  namespaceOverride: ~
  upgrade:
    fromV2: true
  apiVersionOverride:
    podDisruptionBudget: policy/v1
  # CRDs configuration
  crds:
    install: true
    migration:
      enabled: true
      image:
        defaultRegistry: registry1.dso.mil
        repository: ironbank/opensource/kyverno/kyvernocli
        tag: 'v1.18.1'
      imagePullSecrets:
        - name: private-registry

  # Configuration
  config:
    defaultRegistry: registry1.dso.mil
  existingImagePullSecrets:
    - private-registry
  webhooksCleanup:
    enabled: true
    image:
      registry: registry1.dso.mil
      repository: ironbank/opensource/kubernetes/kubectl
      tag: 'v1.35.5'
      pullPolicy: ~
    imagePullSecrets:
      - name: private-registry
    podSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        cpu: "0.5"
        memory: "256Mi"
      requests:
        cpu: "0.5"
        memory: "256Mi"
  grafana:
    enabled: false
  features:
    policyExceptions:
      enabled: true
      namespace: 'kyverno'

  # Admission controller configuration
  admissionController:
    rbac:
      serviceAccount:
        automountServiceAccountToken: true
      coreClusterRole:
        extraResources:
          - apiGroups:
              - '*'
            resources:
              - '*'
            verbs:
              - get
              - list
              - watch

      clusterRole:
        extraResources:
          - apiGroups:
              - '*'
            resources:
              - '*'
            verbs:
              - get
              - list
              - watch
    createSelfSignedCert: false
    replicas: 3
    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
    podDisruptionBudget:
      enabled: false
    imagePullSecrets:
      - name: private-registry
    initContainer:
      image:
        registry: ~
        defaultRegistry: registry1.dso.mil
        repository: ironbank/opensource/kyverno/kyvernopre
        tag: 'v1.18.1'
        pullPolicy: ~
      resources:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 10m
          memory: 64Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
    container:
      image:
        defaultRegistry: registry1.dso.mil
        repository: ironbank/opensource/kyverno
        tag: 'v1.18.1'
        pullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
  # Background controller configuration
  backgroundController:
    enabled: true
    rbac:
      create: true
      serviceAccount:
        automountServiceAccountToken: false
      coreClusterRole:
        extraResources:
          - apiGroups:
              - networking.k8s.io
            resources:
              - ingresses
              - ingressclasses
              - networkpolicies
            verbs:
              - create
              - update
              - patch
              - delete
          - apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - rolebindings
              - roles
            verbs:
              - create
              - update
              - patch
              - delete
          - apiGroups:
              - '*'
            resources:
              - configmaps
              - resourcequotas
              - limitranges
            verbs:
              - create
              - update
              - patch
              - delete
          - apiGroups:
              - '*'
            resources:
              - serviceaccounts
            verbs:
              - get
              - list
              - watch
              - update
              - patch
      clusterRole:
        extraResources:
          - apiGroups:
              - '*'
            resources:
              - '*'
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - '*'
            resources:
              - secrets
            verbs:
              - create
              - update
              - delete
    image:
      defaultRegistry: registry1.dso.mil
      repository: ironbank/opensource/kyverno/kyverno/background-controller
      tag: 'v1.18.1'
    imagePullSecrets:
      - name: private-registry
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  cleanupController:
    enabled: true
    rbac:
      create: true
      serviceAccount:
        automountServiceAccountToken: false

    image:
      defaultRegistry: registry1.dso.mil
      repository: ironbank/opensource/kyverno/kyverno/cleanup-controller
      tag: 'v1.18.1'
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: private-registry
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  reportsController:
    enabled: true
    rbac:
      create: true
      serviceAccount:
        automountServiceAccountToken: false
      coreClusterRole:
        extraResources:
          - apiGroups:
              - '*'
            resources:
              - '*'
            verbs:
              - get
              - list
              - watch
      clusterRole:
        extraResources:
          - apiGroups:
              - '*'
            resources:
              - '*'
            verbs:
              - get
              - list
              - watch
    image:
      defaultRegistry: registry1.dso.mil
      repository: ironbank/opensource/kyverno/kyverno/reports-controller
      tag: 'v1.18.1'
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: private-registry
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  # Tests configuration
  test:
    sleep: 20
    image:
      registry: registry1.dso.mil
      repository: ironbank/opensource/kyverno/kyverno/readiness-checker
      tag: 'v1.18.1'
      pullPolicy: ~
    imagePullSecrets:
      - name: private-registry
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
