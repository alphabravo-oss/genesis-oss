# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Prometheus Operator admission webhook cert-manager resources
templates:
  - charts/upstream/templates/prometheus-operator/certmanager.yaml
release:
  name: monitoring
  namespace: monitoring
tests:
  - it: renders cert-manager resources by default
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: kind
          value: Issuer
        documentIndex: 0
      - equal:
          path: metadata.name
          value: monitoring-kube-prometheus-self-signed-issuer
        documentIndex: 0
      - equal:
          path: spec.selfSigned
          value: {}
        documentIndex: 0
      - equal:
          path: kind
          value: Certificate
        documentIndex: 1
      - equal:
          path: metadata.name
          value: monitoring-kube-prometheus-root-cert
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: monitoring-kube-prometheus-root-cert
        documentIndex: 1
      - equal:
          path: kind
          value: Issuer
        documentIndex: 2
      - equal:
          path: metadata.name
          value: monitoring-kube-prometheus-root-issuer
        documentIndex: 2
      - equal:
          path: kind
          value: Certificate
        documentIndex: 3
      - equal:
          path: metadata.name
          value: monitoring-kube-prometheus-admission
        documentIndex: 3
      - equal:
          path: spec.issuerRef.name
          value: monitoring-kube-prometheus-root-issuer
        documentIndex: 3

  - it: renders nothing when cert-manager mode is disabled
    set:
      upstream.prometheusOperator.admissionWebhooks.certManager.enabled: false
    asserts:
      - hasDocuments:
          count: 0
