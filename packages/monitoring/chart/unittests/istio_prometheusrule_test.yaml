# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Monitoring istio prometheus rule
templates:
  - templates/bigbang/rules/istio-proxy-mem-prometheusrule.yaml
release:
  name: monitoring
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1
values:
  - values/istio-prometheusrule.yaml
tests:
  - it: renders nothing when istio is disabled
    set:
      istio.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when all rule toggles are false
    set:
      prometheusRule.IstioSidecarMemModerate: false
      prometheusRule.IstioSidecarMemHigh: false
      prometheusRule.Istio5XXResponseCode: false
      prometheusRule.IstioSidecarEndpointError: false
      prometheusRule.IstioSidecarListenerConflict: false
      prometheusRule.IstioAmbientReadinessProbeFailures: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders all 6 alerts when all toggles are true
    asserts:
      - containsDocument:
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
      - lengthEqual:
          path: spec.groups[0].rules
          count: 6
      - equal:
          path: spec.groups[0].rules[0].alert
          value: IstioSidecarMemModerate
      - equal:
          path: spec.groups[0].rules[1].alert
          value: IstioSidecarMemHigh
      - equal:
          path: spec.groups[0].rules[2].alert
          value: Istio5XXResponseCode
      - equal:
          path: spec.groups[0].rules[2].annotations.description
          value: Multiple {{ $labels.response_code }} Errors for pod {{ $labels.pod_name }}
      - equal:
          path: spec.groups[0].rules[3].alert
          value: IstioSidecarEndpointError
      - equal:
          path: spec.groups[0].rules[4].alert
          value: IstioSidecarListenerConflict
      - equal:
          path: spec.groups[0].rules[5].alert
          value: IstioAmbientReadinessProbeFailures

  - it: renders only one alert when single toggle enabled
    set:
      prometheusRule.IstioSidecarMemModerate: true
      prometheusRule.IstioSidecarMemHigh: false
      prometheusRule.Istio5XXResponseCode: false
      prometheusRule.IstioSidecarEndpointError: false
      prometheusRule.IstioSidecarListenerConflict: false
      prometheusRule.IstioAmbientReadinessProbeFailures: false
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.groups[0].rules
          count: 1
      - equal:
          path: spec.groups[0].rules[0].alert
          value: IstioSidecarMemModerate

  - it: validates severity levels for memory alerts
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: warning
      - equal:
          path: spec.groups[0].rules[1].labels.severity
          value: critical
