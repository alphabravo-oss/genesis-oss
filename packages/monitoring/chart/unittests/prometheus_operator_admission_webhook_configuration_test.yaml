# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Prometheus Operator admission webhook configurations
templates:
  - charts/upstream/templates/prometheus-operator/admission-webhooks/validatingWebhookConfiguration.yaml
release:
  name: monitoring
  namespace: monitoring
tests:
  - it: annotates validating webhook for cert-manager CA injection by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: monitoring/monitoring-kube-prometheus-admission
      - equal:
          path: webhooks[0].failurePolicy
          value: Ignore
      - equal:
          path: webhooks[0].clientConfig.service.name
          value: monitoring-kube-prometheus-operator

  - it: fails closed on upgrade after the operator webhook is available
    release:
      revision: 2
      upgrade: true
    asserts:
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
