{{- if and .Values.bbtests .Values.bbtests.enabled .Values.bbtests.scripts (ne false .Values.bbtests.scripts.enabled) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-script-cert-manager-admission
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
  labels:
    {{ include "kube-prometheus-stack.labels" . | indent 4 }}
rules:
# These are the rules beyond the default gluon provided rules that are needed for the script tests to run successfully.
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-script-cert-manager-admission
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
  labels:
    {{ include "kube-prometheus-stack.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-script-cert-manager-admission
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-script-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
