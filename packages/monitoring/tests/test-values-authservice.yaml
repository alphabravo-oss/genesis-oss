#########################
# Required for package #
########################
grafana:
  enabled: true
kiali:
  enabled: true
  values:
    bbtests:
      enabled: false
    networkPolicies:
      ingress:
        to:
          kiali:20001:
            from:
              k8s:
                monitoring/*: true
monitoring:
  enabled: true
  sso:
    enabled: true
    prometheus:
      client_id: dev_00eb8904-5b88-4c68-ad67-cec0d2e07aa6_prometheus
    alertmanager:
      client_id: dev_00eb8904-5b88-4c68-ad67-cec0d2e07aa6_alertmanager
  values:
    bbtests:
      enabled: true
      cypress:
        envs:
          cypress_keycloak_test_enable: "true"
certManager:
  enabled: true
kyverno:
  values:
    bbtests:
      enabled: false
kyvernoPolicies:
  values:
    bbtests:
      enabled: false
istio:
  ambient:
    enabled: true
sso:
  url: https://keycloak.dev.bigbang.mil/auth/realms/baby-yoda
addons:
  authservice:
    enabled: true
  keycloak:
    enabled: true