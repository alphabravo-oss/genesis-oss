# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Policy-specific tests only. Shared helper tests (validationActions, failurePolicy,
# background, webhookTimeoutSeconds, autogenControllers, matchConstraints,
# matchConditions, excludeNamespaces, excludeContainers) are in
# vpol-shared-helpers_test.yaml.
suite: block-ephemeral-containers-cel ValidatingPolicy
templates:
  - templates/other-vpol/block-ephemeral-containers-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        block-ephemeral-containers-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: block-ephemeral-containers-cel

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        block-ephemeral-containers-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        block-ephemeral-containers-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0
