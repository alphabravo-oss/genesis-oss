# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: restrict-host-path-mount-pv-cel ValidatingPolicy
templates:
  - templates/other-vpol/restrict-host-path-mount-pv-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        restrict-host-path-mount-pv-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - isAPIVersion:
          of: policies.kyverno.io/v1
      - equal:
          path: metadata.name
          value: restrict-host-path-mount-pv-cel
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources[0]
          value: persistentvolumes

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        restrict-host-path-mount-pv-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        restrict-host-path-mount-pv-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "allow: converts legacy wildcard paths to anchored CEL regex patterns"
    set:
      enabled: true
      celPoliciesBeta:
        restrict-host-path-mount-pv-cel:
          enabled: true
          parameters:
            allow:
              - /tmp/allowed
              - /var/lib/rancher/k3s/storage/pvc-*
    asserts:
      - equal:
          path: spec.variables[0].name
          value: allowedPathPatterns
      - equal:
          path: spec.variables[0].expression
          value: '["^/tmp/allowed$","^/var/lib/rancher/k3s/storage/pvc-.*$"]'

  - it: "allow: empty list preserves legacy deny-all-hostPath behavior"
    set:
      enabled: true
      celPoliciesBeta:
        restrict-host-path-mount-pv-cel:
          enabled: true
          parameters:
            allow: []
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: '[]'
      - equal:
          path: spec.validations[0].expression
          value: |-
            !object.spec.?hostPath.hasValue() || variables.allowedPathPatterns.exists(pattern,
              object.spec.hostPath.path.matches(pattern))

  - it: "matchConditions: renders user-supplied conditions without namespace exclusions"
    set:
      enabled: true
      celPoliciesBeta:
        excludeNamespaces:
          - kube-system
        restrict-host-path-mount-pv-cel:
          enabled: true
          matchConditions:
            - name: skip-local-pv
              expression: "object.metadata.name != 'local-pv'"
    asserts:
      - equal:
          path: spec.matchConditions[0].name
          value: skip-local-pv
      - equal:
          path: spec.matchConditions[0].expression
          value: "object.metadata.name != 'local-pv'"
      - lengthEqual:
          path: spec.matchConditions
          count: 1
