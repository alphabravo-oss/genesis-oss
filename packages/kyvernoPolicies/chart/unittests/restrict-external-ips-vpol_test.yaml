# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: restrict-external-ips-cel ValidatingPolicy
templates:
  - templates/other-vpol/restrict-external-ips-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        restrict-external-ips-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: restrict-external-ips-cel

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        restrict-external-ips-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        restrict-external-ips-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "allow: inlines allow-list entries into the CEL expression"
    set:
      enabled: true
      celPoliciesBeta:
        restrict-external-ips-cel:
          enabled: true
          parameters:
            allow:
              - '192\.168\.0\.1'
              - '10\.0\.0\..+'
    asserts:
      - equal:
          path: spec.validations[0].message
          value: "Only externalIPs in the approved list are allowed."

  - it: "allow: empty list blocks any externalIPs"
    set:
      enabled: true
      celPoliciesBeta:
        restrict-external-ips-cel:
          enabled: true
          parameters:
            allow: []
    asserts:
      - equal:
          path: spec.validations[0].message
          value: "No externalIPs are allowed."
