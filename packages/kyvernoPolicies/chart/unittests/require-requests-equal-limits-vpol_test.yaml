# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: require-requests-equal-limits-cel ValidatingPolicy
templates:
  - templates/other-vpol/require-requests-equal-limits-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        require-requests-equal-limits-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: require-requests-equal-limits-cel
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "(?s)requests.+cpu.+limits.+cpu.+requests.+memory.+limits.+memory"
      - equal:
          path: spec.validations[0].message
          value: "CPU/memory requests must be equal to limits"

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        require-requests-equal-limits-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        require-requests-equal-limits-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0
