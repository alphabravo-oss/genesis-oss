# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: update-image-registry-cel MutatingPolicy
templates:
  - templates/other-mpol/update-image-registry-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should not render when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        update-image-registry-cel:
          enabled: true
          parameters:
            update:
              - from: replace.image.registry
                to: registry1.dso.mil
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a MutatingPolicy when enabled
    set:
      celPoliciesBeta:
        update-image-registry-cel:
          enabled: true
          parameters:
            update:
              - from: replace.image.registry
                to: registry1.dso.mil
    asserts:
      - isKind:
          of: MutatingPolicy
      - isAPIVersion:
          of: policies.kyverno.io/v1
      - equal:
          path: metadata.name
          value: update-image-registry-cel
      - equal:
          path: metadata.annotations["policies.kyverno.io/severity"]
          value: "medium"
      - equal:
          path: spec.failurePolicy
          value: Fail
      - notExists:
          path: spec.validationActions

  - it: one update entry renders three mutations rewriting the from registry
    set:
      celPoliciesBeta:
        update-image-registry-cel:
          enabled: true
          parameters:
            update:
              - from: replace.image.registry
                to: registry1.dso.mil
    asserts:
      - lengthEqual:
          path: spec.mutations
          count: 3
      - matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: 'object\.spec\.containers\.filter\(c, c\.image\.find\("replace\.image\.registry"\) != ""\)'
      - matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: 'image: c\.image\.replace\(c\.image\.find\("replace\.image\.registry"\), "registry1\.dso\.mil"\)'

  - it: multiple update entries render three mutations each
    set:
      celPoliciesBeta:
        update-image-registry-cel:
          enabled: true
          parameters:
            update:
              - from: replace.image.registry
                to: intermediate.registry
              - from: intermediate.registry
                to: registry1.dso.mil
    asserts:
      - lengthEqual:
          path: spec.mutations
          count: 6

  - it: should fail when enabled with an empty update list
    set:
      celPoliciesBeta:
        update-image-registry-cel:
          enabled: true
          parameters:
            update: []
    asserts:
      - failedTemplate:
          errorPattern: "parameters.update-image-registry-cel.parameters.update is empty|parameters.update is empty"

  - it: should fail when an update entry omits from
    set:
      celPoliciesBeta:
        update-image-registry-cel:
          enabled: true
          parameters:
            update:
              - to: registry1.dso.mil
    asserts:
      - failedTemplate:
          errorPattern: "each parameters.update entry must set 'from'"

  - it: should fail when an update entry omits to
    set:
      celPoliciesBeta:
        update-image-registry-cel:
          enabled: true
          parameters:
            update:
              - from: replace.image.registry
    asserts:
      - failedTemplate:
          errorPattern: "each parameters.update entry must set 'to'"
