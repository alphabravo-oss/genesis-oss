# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: restrict-user-id-cel ValidatingPolicy
templates:
  - templates/other-vpol/restrict-user-id-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should not render when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render with default allow range
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: restrict-user-id-cel
      - equal:
          path: spec.variables[0].name
          value: allowRanges
      - equal:
          path: spec.variables[0].expression
          value: '[{"min":1000}]'
      - equal:
          path: spec.variables[1].name
          value: denyRanges
      - equal:
          path: spec.variables[1].expression
          value: '[]'
      - equal:
          path: spec.variables[2].name
          value: allContainers
      - lengthEqual:
          path: spec.validations
          count: 2

  - it: should embed allow and deny ranges when set
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow:
              - min: 1000
                max: 1999
              - min: 65534
                max: 65534
            deny:
              - min: 1500
                max: 1500
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: '[{"max":1999,"min":1000},{"max":65534,"min":65534}]'
      - equal:
          path: spec.variables[1].expression
          value: '[{"max":1500,"min":1500}]'

  - it: should render with only deny ranges set
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow: []
            deny:
              - min: 0
                max: 999
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: '[]'
      - equal:
          path: spec.variables[1].expression
          value: '[{"max":999,"min":0}]'

  - it: should fail when both allow and deny are empty
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow: []
            deny: []
    asserts:
      - failedTemplate:
          errorPattern: "both celPoliciesBeta.+allow.+and .deny are empty"

  - it: should fail when an allow entry has neither min nor max
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow:
              - {}
    asserts:
      - failedTemplate:
          errorPattern: "must set min, max, or both"

  - it: should fail when an allow entry has non-numeric min
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow:
              - min: nope
    asserts:
      - failedTemplate:
          errorPattern: "min must be an integer"

  - it: should allow integer-valued float range bounds
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow:
              - min: 1000.0
                max: 1999.0
            deny:
              - min: 1500.0
                max: 1599.0
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: '[{"max":1999,"min":1000}]'
      - equal:
          path: spec.variables[1].expression
          value: '[{"max":1599,"min":1500}]'

  - it: should fail when an allow entry has a fractional float min
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow:
              - min: 1000.5
    asserts:
      - failedTemplate:
          errorPattern: "allow min must be an integer"

  - it: should fail when min is greater than max
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            allow:
              - min: 2000
                max: 1000
    asserts:
      - failedTemplate:
          errorPattern: "min must be less than or equal to max"

  - it: should fail when a deny entry has neither min nor max
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            deny:
              - {}
    asserts:
      - failedTemplate:
          errorPattern: "must set min, max, or both"

  - it: should fail when a deny entry has non-numeric min
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            deny:
              - min: nope
    asserts:
      - failedTemplate:
          errorPattern: "deny min must be an integer"

  - it: should fail when a deny entry has a fractional float max
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            deny:
              - max: 999.5
    asserts:
      - failedTemplate:
          errorPattern: "deny max must be an integer"

  - it: should fail when deny min is greater than max
    set:
      celPoliciesBeta:
        restrict-user-id-cel:
          enabled: true
          parameters:
            deny:
              - min: 2000
                max: 1000
    asserts:
      - failedTemplate:
          errorPattern: "deny min must be less than or equal to max"
