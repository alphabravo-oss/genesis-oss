# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: require-image-signature-cel ImageValidatingPolicy
templates:
  - templates/other-vpol/require-image-signature-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: renders an ImageValidatingPolicy when enabled
    set:
      enabled: true
      celPoliciesBeta:
        require-image-signature-cel:
          enabled: true
    asserts:
      - isKind:
          of: ImageValidatingPolicy
      - equal:
          path: apiVersion
          value: policies.kyverno.io/v1
      - equal:
          path: metadata.name
          value: require-image-signature-cel
      - equal:
          path: spec.matchImageReferences[0].glob
          value: registry1.dso.mil/ironbank/*
      - equal:
          path: spec.attestors[0].name
          value: ironbank
      - equal:
          path: spec.validationConfigurations.mutateDigest
          value: false
      - equal:
          path: spec.validationConfigurations.verifyDigest
          value: false

  - it: does not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        require-image-signature-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        require-image-signature-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when matchImageReferences is empty
    set:
      enabled: true
      celPoliciesBeta:
        require-image-signature-cel:
          enabled: true
          parameters:
            matchImageReferences: []
            attestors:
              - name: ironbank
                cosign:
                  key:
                    data: "stub"
    asserts:
      - failedTemplate:
          errorMessage: "require-image-signature-cel is enabled but celPoliciesBeta.require-image-signature-cel.parameters.matchImageReferences is empty - disable the policy or provide image globs"

  - it: fails when attestors is empty
    set:
      enabled: true
      celPoliciesBeta:
        require-image-signature-cel:
          enabled: true
          parameters:
            matchImageReferences:
              - glob: "registry1.dso.mil/ironbank/*"
            attestors: []
    asserts:
      - failedTemplate:
          errorMessage: "require-image-signature-cel is enabled but celPoliciesBeta.require-image-signature-cel.parameters.attestors is empty - disable the policy or provide a signing key"

  - it: weaves each attestor name into the validation expression
    set:
      enabled: true
      celPoliciesBeta:
        require-image-signature-cel:
          enabled: true
          parameters:
            matchImageReferences:
              - glob: "registry1.dso.mil/ironbank/*"
            attestors:
              - name: ironbank
                cosign:
                  key:
                    data: "stub"
              - name: backup
                cosign:
                  key:
                    data: "stub"
    asserts:
      - matchRegex:
          path: spec.validations[0].expression
          pattern: 'attestors\["ironbank"\].*attestors\["backup"\]'
