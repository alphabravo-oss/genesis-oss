# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Policy-specific tests only. Shared helper tests (validationActions, failurePolicy,
# background, webhookTimeoutSeconds, autogenControllers, matchConstraints,
# matchConditions, excludeNamespaces, excludeContainers) are in
# vpol-shared-helpers_test.yaml.
suite: disallow-privilege-escalation-cel ValidatingPolicy
templates:
  - templates/pod-security-vpol/restricted/disallow-privilege-escalation-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        disallow-privilege-escalation-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: disallow-privilege-escalation-cel

  - it: should contain the CEL privilege-escalation validation
    set:
      enabled: true
      celPoliciesBeta:
        disallow-privilege-escalation-cel:
          enabled: true
    asserts:
      - contains:
          path: spec.validations
          content:
            expression: >-
              variables.allContainers.all(container,
              container.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
            message: >-
              Privilege escalation is disallowed.
              All containers must set securityContext.allowPrivilegeEscalation to `false`.

  - it: "severity: defaults to high"
    set:
      enabled: true
      celPoliciesBeta:
        disallow-privilege-escalation-cel:
          enabled: true
    asserts:
      - equal:
          path: metadata.annotations["policies.kyverno.io/severity"]
          value: "high"

  - it: "severity: per-policy override"
    set:
      enabled: true
      celPoliciesBeta:
        disallow-privilege-escalation-cel:
          enabled: true
          severity: medium
    asserts:
      - equal:
          path: metadata.annotations["policies.kyverno.io/severity"]
          value: "medium"
