# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: update-automountserviceaccounttokens ClusterPolicy
templates:
  - templates/update-automountserviceaccounttokens.yaml

capabilities:
  apiVersions:
    - kyverno.io/v2

tests:
  - it: should not render when disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: wildcard ServiceAccount scope omits names while preserving pod allow exceptions
    set:
      enabled: true
      policies:
        update-automountserviceaccounttokens:
          enabled: true
          namespaces:
            - namespace: istio-system
              pods:
                allow:
                  - istiod-*
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterPolicy
        documentIndex: 0
      - equal:
          path: spec.rules[0].name
          value: disables-serviceaccounts
        documentIndex: 0
      - equal:
          path: spec.rules[0].match.any[0].resources.namespaces[0]
          value: istio-system
        documentIndex: 0
      - notExists:
          path: spec.rules[0].match.any[0].resources.names
        documentIndex: 0
      - equal:
          path: spec.rules[1].name
          value: enable-pods
        documentIndex: 0
      - equal:
          path: spec.rules[1].match.any[0].resources.names[0]
          value: istiod-*
        documentIndex: 0
      - equal:
          path: spec.rules[2].name
          value: enable-statefulset-and-deployments
        documentIndex: 0
      - isKind:
          of: PolicyException
        documentIndex: 1

  - it: explicit ServiceAccount scope renders names as an array
    set:
      enabled: true
      policies:
        update-automountserviceaccounttokens:
          enabled: true
          namespaces:
            - namespace: team-a
              serviceAccounts:
                - builder
                - deployer
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].name
          value: disables-serviceaccounts
      - equal:
          path: spec.rules[0].match.any[0].resources.names
          value:
            - builder
            - deployer

  - it: empty pod lists do not render pod mutation branches
    set:
      enabled: true
      policies:
        update-automountserviceaccounttokens:
          enabled: true
          namespaces:
            - namespace: team-a
              serviceAccounts:
                - builder
              pods:
                allow: []
                deny: []
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].name
          value: disables-serviceaccounts
