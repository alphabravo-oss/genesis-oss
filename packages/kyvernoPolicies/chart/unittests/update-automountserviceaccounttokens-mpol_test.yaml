# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: update-automountserviceaccounttokens-cel MutatingPolicy
templates:
  - templates/other-mpol/update-automountserviceaccounttokens-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
    - kyverno.io/v2
tests:
  - it: should not render when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              serviceAccounts: [builder]
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail loudly when enabled with no actionable targets
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
    asserts:
      - failedTemplate:
          errorMessage: update-automountserviceaccounttokens-cel is enabled but celPoliciesBeta.update-automountserviceaccounttokens-cel.namespaces has no actionable targets - disable the policy or provide serviceAccounts, pods.allow, or pods.deny entries

  - it: renders serviceaccount and pod mpols when configured
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              serviceAccounts: [builder]
              pods:
                allow: ['api-client-[0-9]+']
                deny: ['no-api-[0-9]+']
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: update-automountserviceaccounttokens-cel-serviceaccounts
        documentIndex: 0
      - equal:
          path: metadata.name
          value: update-automountserviceaccounttokens-cel
        documentIndex: 1

  - it: serviceaccount scope matchCondition uses anchored regex input
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              serviceAccounts:
                - builder
                - builder-[0-9]+
    asserts:
      - equal:
          path: spec.matchConditions[1].name
          value: scope-to-configured-serviceaccounts
        documentIndex: 0
      - matchRegex:
          path: spec.matchConditions[1].expression
          pattern: 'object\.metadata\.namespace == "team-a"'
        documentIndex: 0
      - matchRegex:
          path: spec.matchConditions[1].expression
          pattern: 'object\.metadata\.name\.matches\("\^builder\$"\)'
        documentIndex: 0
      - matchRegex:
          path: spec.matchConditions[1].expression
          pattern: 'object\.metadata\.name\.matches\("\^builder-\[0-9\]\+\$"\)'
        documentIndex: 0

  - it: pod mpol scope gate unions allow and deny and mutation picks deny-wins value
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              pods:
                allow: ['api-client-[0-9]+']
                deny: ['api-client-debug-[0-9]+']
    asserts:
      - equal:
          path: spec.matchConditions[0].name
          value: scope-to-configured-pods
        documentIndex: 0
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: 'api-client-\[0-9\]\+'
        documentIndex: 0
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: 'api-client-debug-\[0-9\]\+'
        documentIndex: 0
      - lengthEqual:
          path: spec.mutations
          count: 1
      - matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: 'api-client-debug-\[0-9\]\+.*\) \? false : true'
        documentIndex: 0

  - it: allow-only config leaves the deny branch of the ternary as CEL false
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              pods:
                allow: ['api-client-[0-9]+']
    asserts:
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: '\(false\)'
        documentIndex: 0
      - matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: '\(false\) \? false : true'
        documentIndex: 0

  - it: deny-only config leaves the allow branch of the scope gate as CEL false
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              pods:
                deny: ['no-api-[0-9]+']
    asserts:
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: '\(false\) \|\|'
        documentIndex: 0
      - matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: 'no-api-\[0-9\]\+.*\) \? false : true'
        documentIndex: 0

  - it: pod-only config renders just the pod mpol
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              pods:
                allow: ['api-client-[0-9]+']
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: update-automountserviceaccounttokens-cel
        documentIndex: 0

  - it: serviceaccount-only config renders only the serviceaccount mpol
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              serviceAccounts: [builder]
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: update-automountserviceaccounttokens-cel-serviceaccounts
        documentIndex: 0

  - it: serviceaccount mpol excludes the builtin default serviceaccount
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          namespaces:
            - namespace: team-a
              serviceAccounts: [builder]
    asserts:
      - equal:
          path: spec.matchConditions[0].name
          value: exclude-default-serviceaccount
        documentIndex: 0
      - equal:
          path: spec.matchConditions[0].expression
          value: object.metadata.name != "default"
        documentIndex: 0

  - it: serviceaccount mpol inherits shared CEL namespace exclusions and matchConditions
    set:
      celPoliciesBeta:
        excludeNamespaces:
          - kube-system
        update-automountserviceaccounttokens-cel:
          enabled: true
          matchConditions:
            - name: exclude-ops-ns
              expression: object.metadata.namespace != "ops"
          namespaces:
            - namespace: team-a
              serviceAccounts: [builder]
    asserts:
      - equal:
          path: spec.matchConditions[2].name
          value: exclude-namespaces
        documentIndex: 0
      - equal:
          path: spec.matchConditions[2].expression
          value: "!(object.metadata.namespace in [\"kube-system\"])"
        documentIndex: 0
      - equal:
          path: spec.matchConditions[3].name
          value: exclude-ops-ns
        documentIndex: 0
      - equal:
          path: spec.matchConditions[3].expression
          value: object.metadata.namespace != "ops"
        documentIndex: 0

  - it: pod mpol defaults failurePolicy to Fail and carries autogen for configured controllers
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-cel:
          enabled: true
          autogenControllers: "Deployment,StatefulSet"
          namespaces:
            - namespace: team-a
              pods:
                allow: ['api-client-[0-9]+']
    asserts:
      - equal:
          path: spec.failurePolicy
          value: Fail
        documentIndex: 0
      - equal:
          path: metadata.name
          value: update-automountserviceaccounttokens-cel
        documentIndex: 0
      - equal:
          path: spec.autogen.podControllers.controllers[0]
          value: deployments
        documentIndex: 0
      - equal:
          path: spec.autogen.podControllers.controllers[1]
          value: statefulsets
        documentIndex: 0
