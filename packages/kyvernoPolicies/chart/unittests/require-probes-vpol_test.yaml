# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: require-probes-cel ValidatingPolicy
templates:
  - templates/other-vpol/require-probes-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        require-probes-cel:
          enabled: true
          parameters:
            readinessProbe: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: require-probes-cel

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        require-probes-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        require-probes-cel:
          enabled: true
          parameters:
            readinessProbe: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when no probes are enabled
    set:
      enabled: true
      celPoliciesBeta:
        require-probes-cel:
          enabled: true
          parameters:
            readinessProbe: false
            livenessProbe: false
            startupProbe: false
    asserts:
      - failedTemplate:
          errorMessage: require-probes-cel is enabled but no probes are set to true - disable the policy or enable at least one probe type

  - it: generates one validation per enabled probe
    set:
      enabled: true
      celPoliciesBeta:
        require-probes-cel:
          enabled: true
          parameters:
            readinessProbe: true
            livenessProbe: true
            startupProbe: false
    asserts:
      - lengthEqual:
          path: spec.validations
          count: 2

  - it: generates three validations when all probes enabled
    set:
      enabled: true
      celPoliciesBeta:
        require-probes-cel:
          enabled: true
          parameters:
            readinessProbe: true
            livenessProbe: true
            startupProbe: true
    asserts:
      - lengthEqual:
          path: spec.validations
          count: 3
