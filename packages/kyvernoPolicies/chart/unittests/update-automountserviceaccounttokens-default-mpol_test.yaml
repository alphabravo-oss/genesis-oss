# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: update-automountserviceaccounttokens-default-cel MutatingPolicy
templates:
  - templates/other-mpol/update-automountserviceaccounttokens-default-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should not render when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        update-automountserviceaccounttokens-default-cel:
          enabled: true
          namespaces:
            - foo
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an admission policy and a mutate-existing policy
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-default-cel:
          enabled: true
          namespaces:
            - foo
            - bar
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: update-automountserviceaccounttokens-default-cel
      - documentIndex: 0
        equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: [CREATE]
      - documentIndex: 0
        equal:
          path: spec.matchConditions[0].expression
          value: object.metadata.namespace in ["foo","bar"]
      - documentIndex: 0
        notExists:
          path: spec.evaluation.mutateExisting
      - documentIndex: 1
        equal:
          path: metadata.name
          value: update-automountserviceaccounttokens-default-cel-existing
      - documentIndex: 1
        equal:
          path: spec.evaluation.mutateExisting.enabled
          value: true
      - documentIndex: 1
        equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: [CREATE, UPDATE]
      - documentIndex: 1
        equal:
          path: spec.targetMatchConstraints.namespaceSelector.matchExpressions[0].values
          value: [foo, bar]

  - it: should fail when enabled with no namespaces
    set:
      celPoliciesBeta:
        update-automountserviceaccounttokens-default-cel:
          enabled: true
          namespaces: []
    asserts:
      - failedTemplate:
          errorPattern: "namespaces is empty"
