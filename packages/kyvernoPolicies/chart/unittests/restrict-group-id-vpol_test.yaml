# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: restrict-group-id-cel ValidatingPolicy
templates:
  - templates/other-vpol/restrict-group-id-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should not render when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        restrict-group-id-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render with default allow range
    set:
      celPoliciesBeta:
        restrict-group-id-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: restrict-group-id-cel
      - equal:
          path: spec.variables[0].name
          value: allowRanges
      - equal:
          path: spec.variables[0].expression
          value: '[{"min":1000}]'
      - equal:
          path: spec.variables[1].name
          value: denyRanges
      - equal:
          path: spec.variables[1].expression
          value: '[]'
      - lengthEqual:
          path: spec.validations
          count: 4

  - it: should embed deny ranges when set
    set:
      celPoliciesBeta:
        restrict-group-id-cel:
          enabled: true
          parameters:
            allow:
              - min: 1000
                max: 1999
              - min: 65534
                max: 65534
            deny:
              - min: 1500
                max: 1500
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: '[{"max":1999,"min":1000},{"max":65534,"min":65534}]'
      - equal:
          path: spec.variables[1].expression
          value: '[{"max":1500,"min":1500}]'

  - it: should render with only deny ranges set
    set:
      celPoliciesBeta:
        restrict-group-id-cel:
          enabled: true
          parameters:
            allow: []
            deny:
              - min: 0
                max: 999
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: '[]'
      - equal:
          path: spec.variables[1].expression
          value: '[{"max":999,"min":0}]'

  - it: should fail when both allow and deny are empty
    set:
      celPoliciesBeta:
        restrict-group-id-cel:
          enabled: true
          parameters:
            allow: []
            deny: []
    asserts:
      - failedTemplate:
          errorPattern: "both celPoliciesBeta.+allow.+and .deny are empty"

  - it: should fail when an allow entry has neither min nor max
    set:
      celPoliciesBeta:
        restrict-group-id-cel:
          enabled: true
          parameters:
            allow:
              - {}
    asserts:
      - failedTemplate:
          errorPattern: "must set min, max, or both"
