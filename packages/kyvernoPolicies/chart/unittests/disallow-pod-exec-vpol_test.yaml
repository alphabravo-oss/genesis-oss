# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: disallow-pod-exec-cel ValidatingPolicy
templates:
  - templates/other-vpol/disallow-pod-exec-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        disallow-pod-exec-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: disallow-pod-exec-cel
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations[0]
          value: CONNECT

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        disallow-pod-exec-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        disallow-pod-exec-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0
