# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: disallow-rbac-on-default-serviceaccounts-cel ValidatingPolicy
templates:
  - templates/other-vpol/disallow-rbac-on-default-serviceaccounts-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        disallow-rbac-on-default-serviceaccounts-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: disallow-rbac-on-default-serviceaccounts-cel

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        disallow-rbac-on-default-serviceaccounts-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        disallow-rbac-on-default-serviceaccounts-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should match role bindings and cluster role bindings
    set:
      enabled: true
      celPoliciesBeta:
        disallow-rbac-on-default-serviceaccounts-cel:
          enabled: true
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules[0].apiGroups
          value:
            - rbac.authorization.k8s.io
      - equal:
          path: spec.matchConstraints.resourceRules[0].apiVersions
          value:
            - v1
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value:
            - CREATE
            - UPDATE
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value:
            - rolebindings
            - clusterrolebindings

  - it: should reject default service accounts and service account groups
    set:
      enabled: true
      celPoliciesBeta:
        disallow-rbac-on-default-serviceaccounts-cel:
          enabled: true
    asserts:
      - equal:
          path: spec.validations[0].message
          value: Adding permissions to the default service account is not allowed.
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "ServiceAccount.*default"
      - equal:
          path: spec.validations[1].message
          value: Adding permissions to a service account group is not allowed.
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "Group.*system:serviceaccounts"

  - it: should preserve the service account issuer discovery exclusion
    set:
      enabled: true
      celPoliciesBeta:
        disallow-rbac-on-default-serviceaccounts-cel:
          enabled: true
    asserts:
      - equal:
          path: spec.matchConditions[0].name
          value: exclude-service-account-issuer-discovery
      - equal:
          path: spec.matchConditions[0].expression
          value: "object.metadata.name != 'system:service-account-issuer-discovery'"

  - it: should allow values reset to remove the service account issuer discovery exclusion
    set:
      enabled: true
      celPoliciesBeta:
        disallow-rbac-on-default-serviceaccounts-cel:
          enabled: true
          matchConditions: []
    asserts:
      - notExists:
          path: spec.matchConditions
