# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: require-labels-cel ValidatingPolicy
templates:
  - templates/other-vpol/require-labels-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        require-labels-cel:
          enabled: true
          parameters:
            require:
              - key: app.kubernetes.io/name
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: require-labels-cel

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        require-labels-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        require-labels-cel:
          enabled: true
          parameters:
            require:
              - key: app.kubernetes.io/name
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when require list is empty
    set:
      enabled: true
      celPoliciesBeta:
        require-labels-cel:
          enabled: true
          parameters:
            require: []
    asserts:
      - failedTemplate:
          errorMessage: require-labels-cel is enabled but celPoliciesBeta.require-labels-cel.parameters.require is empty - disable the policy or provide a list of required labels

  - it: generates one validation per require entry
    set:
      enabled: true
      celPoliciesBeta:
        require-labels-cel:
          enabled: true
          parameters:
            require:
              - key: app.kubernetes.io/name
              - key: app.kubernetes.io/instance
                value: myapp
              - key: app.kubernetes.io/version
    asserts:
      - lengthEqual:
          path: spec.validations
          count: 3
