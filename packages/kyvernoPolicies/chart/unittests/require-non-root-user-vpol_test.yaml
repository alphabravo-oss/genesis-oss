# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: require-non-root-user-cel ValidatingPolicy
templates:
  - templates/pod-security-vpol/restricted/require-non-root-user-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should render when enabled
    set:
      enabled: true
      celPoliciesBeta:
        require-non-root-user-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: require-non-root-user-cel

  - it: should not render when disabled
    set:
      enabled: true
      celPoliciesBeta:
        require-non-root-user-cel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        require-non-root-user-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: has one validation
    set:
      enabled: true
      celPoliciesBeta:
        require-non-root-user-cel:
          enabled: true
    asserts:
      - lengthEqual:
          path: spec.validations
          count: 1
