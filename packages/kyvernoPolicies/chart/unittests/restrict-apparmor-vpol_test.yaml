# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: restrict-apparmor-cel ValidatingPolicy
templates:
  - templates/pod-security-vpol/baseline/restrict-apparmor-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should not render when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        restrict-apparmor-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      celPoliciesBeta:
        restrict-apparmor-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - isAPIVersion:
          of: policies.kyverno.io/v1
      - equal:
          path: metadata.name
          value: restrict-apparmor-cel
      - equal:
          path: spec.variables[1].name
          value: allowedProfiles
      - equal:
          path: spec.variables[1].expression
          value: '["^runtime/default$","^localhost/.*$"]'

  - it: should render the legacy AppArmor annotation check by default
    set:
      celPoliciesBeta:
        restrict-apparmor-cel:
          enabled: true
    asserts:
      - lengthEqual:
          path: spec.validations
          count: 1
      - matchRegex:
          path: spec.validations[0].expression
          pattern: container.*apparmor.*security.*beta.*kubernetes.*io
      - notMatchRegex:
          path: spec.validations[0].expression
          pattern: appArmorProfile
