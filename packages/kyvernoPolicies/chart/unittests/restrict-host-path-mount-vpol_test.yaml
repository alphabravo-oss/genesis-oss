# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: restrict-host-path-mount-cel ValidatingPolicy
templates:
  - templates/other-vpol/restrict-host-path-mount-cel.yaml

capabilities:
  apiVersions:
    - policies.kyverno.io/v1
tests:
  - it: should not render when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global enabled is false
    set:
      enabled: false
      celPoliciesBeta:
        restrict-host-path-mount-cel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a deny-all expression when allow list is empty
    set:
      celPoliciesBeta:
        restrict-host-path-mount-cel:
          enabled: true
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: restrict-host-path-mount-cel
      - equal:
          path: spec.validations[0].expression
          value: 'object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))'

  - it: should embed the allow list as an anchored regex alternation
    set:
      celPoliciesBeta:
        restrict-host-path-mount-cel:
          enabled: true
          parameters:
            allow:
              - /tmp/allowed
              - /var/log/.*
    asserts:
      - equal:
          path: spec.validations[0].expression
          value: "object.spec.?volumes.orValue([]).all(v, !has(v.hostPath) || v.hostPath.path.matches('^(/tmp/allowed|/var/log/.*)$'))"
