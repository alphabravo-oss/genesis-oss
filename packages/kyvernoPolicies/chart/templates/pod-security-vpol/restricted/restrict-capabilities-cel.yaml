{{- $name := "restrict-capabilities-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $allow := dig $name "parameters" "allow" (list) .Values.celPoliciesBeta -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Restrict Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: {{ default "high" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adding capabilities is a way for containers in a Pod to request higher levels
      of ability than those with which they may be provisioned. Many capabilities
      allow system-level control and should be prevented. This policy checks
      ephemeralContainers, initContainers, and containers to ensure the only
      capabilities that are added are those in the allowed list (.values.celPoliciesBeta.restrict-capabilities-cel.parameters.allow).
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
  - name: allowedCapabilities
    expression: {{ $allow | toJson | quote }}
  - name: allContainers
    expression: >-
      {{ include "bb-kyverno-policies.vpol-allContainers" (merge (dict "name" $name) .) }}
  validations:
    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.?capabilities.?add.orValue([]).all(cap,
            cap in variables.allowedCapabilities))
      message: >-
        Containers may only add capabilities from the allowed list: {{ join ", " $allow }}.
        Disallowed additions in
        spec.containers[*].securityContext.capabilities.add,
        spec.initContainers[*].securityContext.capabilities.add, or
        spec.ephemeralContainers[*].securityContext.capabilities.add will be rejected.
{{- end -}}
