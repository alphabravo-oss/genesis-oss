{{- $name := "restrict-sysctls-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $allow := dig $name "parameters" "allow" (list) .Values.celPoliciesBeta -}}
{{- /* Escape backslashes when inlining user regex into a CEL string literal. */}}
{{- $escaped := list -}}
{{- range $allow }}{{ $escaped = append $escaped (. | replace "\\" "\\\\") }}{{ end -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Restrict Sysctls
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: {{ default "high" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sysctl can disable security mechanisms or affect all containers on a
      host, and should be restricted to an allowed "safe" subset. A
      sysctl is considered safe if it is namespaced and is isolated from other
      Pods and processes on the same Node.  This policy ensures that all sysctls are
      in the allowed list.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  validations:
  {{- if $allow }}
    - expression: >-
        object.spec.?securityContext.?sysctls.orValue([]).all(s, s.name.matches('^({{ join "|" $escaped }})$'))
      message: >-
        spec.securityContext.sysctls[*].name must match one of: {{ join ", " $allow }}.
  {{- else }}
    - expression: >-
        object.spec.?securityContext.?sysctls.orValue([]).size() == 0
      message: >-
        spec.securityContext.sysctls must not be set (no sysctls are allowed).
  {{- end }}
{{- end -}}
