{{- $name := "restrict-apparmor-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $allow := dig $name "parameters" "allow" nil .Values.celPoliciesBeta -}}
{{- if not $allow -}}
  {{- fail (printf "%s is enabled but celPoliciesBeta.%s.parameters.allow is empty - disable the policy or provide a list of allowed AppArmor profiles" $name $name) -}}
{{- end -}}
{{- $allowedPatterns := list -}}
{{- range $profile := $allow -}}
  {{- $pattern := printf "^%s$" ((regexQuoteMeta $profile) | replace "\\*" ".*") -}}
  {{- $allowedPatterns = append $allowedPatterns $pattern -}}
{{- end -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Restrict AppArmor Profile
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: {{ default "high" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      On hosts using Debian Linux distros, AppArmor is used as an access control framework. AppArmor uses
      the 'runtime/default' profile by default. This policy ensures Pods do not override the AppArmor
      profile with values outside of the allowed list.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
  - name: annotations
    expression: "object.metadata.?annotations.orValue({})"
  - name: allowedProfiles
    expression: {{ $allowedPatterns | toJson | quote }}
  validations:
    - expression: >-
        variables.annotations.all(k,
          !k.matches('^container\\.apparmor\\.security\\.beta\\.kubernetes\\.io/.*$') ||
          variables.allowedProfiles.exists(p, variables.annotations[k].matches(p)))
      message: >-
        The AppArmor annotation container.apparmor.security.beta.kubernetes.io/* must not be defined,
        or must be set to a profile on the approved list: {{ join ", " $allow }}.
{{- end -}}
