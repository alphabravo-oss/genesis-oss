{{- define "disallow-tolerations-cel.condition" -}}
{{- $d := .entry -}}
{{- $parts := list -}}
{{- with $d.key }}{{- $parts = append $parts (printf "(t.?key.orValue('') == '' || t.?key.orValue('').matches('^%s$'))" (. | replace "\\" "\\\\")) -}}{{- end -}}
{{- with $d.value }}{{- $parts = append $parts (printf "(t.?value.orValue('') == '' || t.?value.orValue('').matches('^%s$'))" (. | replace "\\" "\\\\")) -}}{{- end -}}
{{- with $d.effect }}{{- $parts = append $parts (printf "(t.?effect.orValue('') == '' || t.?effect.orValue('').matches('^%s$'))" (. | replace "\\" "\\\\")) -}}{{- end -}}
{{- if not $parts -}}{{- fail "disallow-tolerations-cel: parameters.disallow entry must set at least one of key, value, effect" -}}{{- end -}}
{{ join " && " $parts }}
{{- end -}}
{{- $name := "disallow-tolerations-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $disallow := dig $name "parameters" "disallow" (list) .Values.celPoliciesBeta -}}
{{- if not $disallow -}}
  {{- fail (printf "%s is enabled but celPoliciesBeta.%s.parameters.disallow is empty - disable the policy or provide a list of disallowed taint patterns" $name $name) -}}
{{- end -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Disallow Tolerations
    policies.kyverno.io/category: Best Practices (Security)
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Taints and tolerations provide one mechanism to allow fine-grained control of the
      placement of pods on a specific set of nodes.  To permit the Kubernetes scheduler
      to place a pod on a node with a taint, you can add a toleration to the pod's
      specification.  If a taint is used to restrict a node to critical pods only,
      tolerations that match the taint should not be allowed in unauthorized pods.  This
      policy will block pods with tolerations, including global, that match the disallowed
      taint list.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
    - name: tolerations
      expression: "object.spec.?tolerations.orValue([])"
  validations:
  {{- range $d := $disallow }}
    - expression: >-
        variables.tolerations.all(t, !({{ include "disallow-tolerations-cel.condition" (dict "entry" $d) }}))
      message: >-
        Tolerations matching the taint "{{ default "*" $d.key }}={{ default "*" $d.value }}:{{ default "*" $d.effect }}" are not allowed.
  {{- end }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}-runtimeclass
  annotations:
    policies.kyverno.io/title: Disallow Tolerations (RuntimeClass)
    policies.kyverno.io/category: Best Practices (Security)
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: RuntimeClass
    policies.kyverno.io/description: >-
      RuntimeClass scheduling.tolerations are applied to every pod that uses the runtime
      class, so a permissive RuntimeClass can smuggle disallowed tolerations into
      workloads. This policy applies the same taint allowlist as disallow-tolerations-cel
      to RuntimeClass scheduling.tolerations.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  matchConstraints:
    resourceRules:
      - apiGroups:   ["node.k8s.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["runtimeclasses"]
  {{- if $userConditions }}
  matchConditions:
    {{- toYaml $userConditions | nindent 4 }}
  {{- end }}
  variables:
    - name: tolerations
      expression: "object.?scheduling.?tolerations.orValue([])"
  validations:
  {{- range $d := $disallow }}
    - expression: >-
        variables.tolerations.all(t, !({{ include "disallow-tolerations-cel.condition" (dict "entry" $d) }}))
      message: >-
        RuntimeClass tolerations matching the taint "{{ default "*" $d.key }}={{ default "*" $d.value }}:{{ default "*" $d.effect }}" are not allowed.
  {{- end }}
{{- end -}}
