{{- $name := "disallow-rbac-on-default-serviceaccounts-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Disallow RBAC on Default Service Accounts
    policies.kyverno.io/category: Best Practices (Security)
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: RoleBinding, ClusterRoleBinding
    policies.kyverno.io/description: >-
      By default, pods are run using the automatically created `default`
      ServiceAccount in the pod's namespace. The default service account has no
      permissions other than those of an unauthenticated user. To enforce the
      least privilege best practice, additional permissions should not be
      allowed on the default service account. This policy blocks role binding
      to default service accounts.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["rolebindings", "clusterrolebindings"]
  {{ end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  validations:
    - expression: >-
        object.?subjects.orValue([]).all(subject,
          !(subject.?kind.orValue('') == 'ServiceAccount' && subject.?name.orValue('') == 'default'))
      message: "Adding permissions to the default service account is not allowed."
    - expression: >-
        object.?subjects.orValue([]).all(subject,
          !(subject.?kind.orValue('') == 'Group' && subject.?name.orValue('').startsWith('system:serviceaccounts')))
      message: "Adding permissions to a service account group is not allowed."
{{- end -}}
