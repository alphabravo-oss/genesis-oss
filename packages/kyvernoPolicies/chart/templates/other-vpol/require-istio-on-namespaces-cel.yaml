{{- $name := "require-istio-on-namespaces-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Require Istio on Namespace
    policies.kyverno.io/category: Best Practices (Security)
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      The Istio service mesh encrypts traffic using either a sidecar proxy or ambient mode.
      Unless an application is managing its own encrypted traffic, Istio should be used.
      This policy validates that namespaces have either `istio-injection: enabled` (sidecar mode)
      or `istio.io/dataplane-mode: ambient` (ambient mode) label.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["namespaces"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespacesBy" (merge (dict "name" $name "field" "object.metadata.name") .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
    - name: labels
      expression: "object.metadata.?labels.orValue({})"
  validations:
    - expression: >-
        variables.labels.exists(k, k == 'istio-injection' && variables.labels[k] == 'enabled') ||
        variables.labels.exists(k, k == 'istio.io/dataplane-mode' && variables.labels[k] == 'ambient')
      message: "Namespaces must have either `istio-injection: enabled` or `istio.io/dataplane-mode: ambient` label."
{{- end -}}
