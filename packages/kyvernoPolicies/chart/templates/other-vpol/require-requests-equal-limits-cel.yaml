{{- $name := "require-requests-equal-limits-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Resource Requests Equal Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods which have limits equal to requests are given a Guaranteed quality of service class
      which is the highest schedulable class. The Kubernetes scheduler assigns Guaranteed pods
      only to nodes which have enough resources to fulfil their CPU and memory requests.  In addition,
      Guaranteed pods are the last to be evicted when a node is running low on resources.  This policy
      checks that all containers have memory requests equal to limits to get a Guaranteed QoS class.
      This policy should only be assigned to critical resources.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
  - name: allContainers
    expression: >-
      {{ include "bb-kyverno-policies.vpol-allContainers" (merge (dict "name" $name) .) }}
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?resources.?requests.?cpu.hasValue() &&
          container.?resources.?limits.?cpu.hasValue() &&
          quantity(container.resources.requests.cpu).compareTo(quantity(container.resources.limits.cpu)) == 0 &&
          container.?resources.?requests.?memory.hasValue() &&
          container.?resources.?limits.?memory.hasValue() &&
          quantity(container.resources.requests.memory).compareTo(quantity(container.resources.limits.memory)) == 0
        )
      message: "CPU/memory requests must be equal to limits"
{{- end -}}
