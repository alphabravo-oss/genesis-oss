{{- $name := "require-annotations-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $require := dig $name "parameters" "require" nil .Values.celPoliciesBeta -}}
{{- if not $require -}}
  {{- fail (printf "%s is enabled but celPoliciesBeta.%s.parameters.require is empty - disable the policy or provide a list of required annotations" $name $name) -}}
{{- end -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Require Annotations
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Some annotations control functionality that is needed for cluster-wide tools to function.
      This policy requires the use of annotations and values contained in the specified list.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
  - name: annotations
    expression: "object.metadata.?annotations.orValue({})"
  validations:
  {{- range $r := $require }}
    {{- $celKey := $r.key | replace "\\" "\\\\" }}
    {{- if $r.value }}
    {{- $celValue := $r.value | replace "\\" "\\\\" }}
    - expression: >-
        variables.annotations.exists(k, k.matches('^{{ $celKey }}$') && variables.annotations[k].matches('^{{ $celValue }}$'))
      message: >-
        An annotation with key matching pattern '{{ $r.key }}' with value matching pattern '{{ $r.value }}' is required.
    {{- else }}
    - expression: >-
        variables.annotations.exists(k, k.matches('^{{ $celKey }}$') && variables.annotations[k] != '')
      message: >-
        An annotation with key matching pattern '{{ $r.key }}' and a non-empty value is required.
    {{- end }}
  {{- end }}
{{- end -}}
