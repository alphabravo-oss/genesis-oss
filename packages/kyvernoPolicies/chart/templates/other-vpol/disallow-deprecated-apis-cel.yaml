apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Disallow Deprecated APIs
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: {{ default "low" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Kubernetes APIs
    policies.kyverno.io/description: >-
      Kubernetes APIs are sometimes deprecated and removed after a few releases.
      As a best practice, older API versions should be replaced with newer versions.
      This policy validates for APIs that are deprecated or scheduled for removal.
      Note that checking for some of these resources may require modifying the Kyverno
      ConfigMap to remove filters.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  matchConstraints:
    {{- $byGroup := dict -}}
    {{- range $k8sVersion, $entries := $deprecated -}}
      {{- range $entries -}}
        {{- $existing := default (list) (get $byGroup .group) -}}
        {{- if not (has .resource $existing) -}}
          {{- $_ := set $byGroup .group (append $existing .resource) -}}
        {{- end -}}
      {{- end -}}
    {{- end }}
    resourceRules:
    {{- range $g := keys $byGroup | sortAlpha }}
      - apiGroups:   [{{ $g | quote }}]
        apiVersions: ["*"]
        operations:  ["CREATE", "UPDATE"]
        resources:   [{{ range $i, $r := get $byGroup $g }}{{ if $i }}, {{ end }}{{ $r | quote }}{{ end }}]
    {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
    - name: gvk
      expression: "object.apiVersion + '/' + object.kind"
  validations:
    {{- range $k8sVersion, $entries := $deprecated }}
    {{- $quoted := list -}}
    {{- range $entries }}{{ $quoted = append $quoted (printf "'%s/%s/%s'" .group .version .kind) }}{{ end }}
    - expression: >-
        !(variables.gvk in [{{ join ", " $quoted }}])
      messageExpression: >-
        variables.gvk + ' is deprecated and will be removed in {{ $k8sVersion }}. See: https://kubernetes.io/docs/reference/using-api/deprecation-guide/'
    {{- end }}
{{- end -}}
