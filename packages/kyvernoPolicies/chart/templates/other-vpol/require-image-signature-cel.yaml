{{- $name := "require-image-signature-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $params := dig $name "parameters" (dict) .Values.celPoliciesBeta -}}
{{- $matchImageReferences := dig "matchImageReferences" (list) $params -}}
{{- $attestors := dig "attestors" (list) $params -}}
{{- $credentials := dig "credentials" (dict) $params -}}
{{- $validationConfigurations := dig "validationConfigurations" (dict) $params -}}
{{- if not $matchImageReferences -}}
  {{- fail (printf "%s is enabled but celPoliciesBeta.%s.parameters.matchImageReferences is empty - disable the policy or provide image globs" $name $name) -}}
{{- end -}}
{{- if not $attestors -}}
  {{- fail (printf "%s is enabled but celPoliciesBeta.%s.parameters.attestors is empty - disable the policy or provide a signing key" $name $name) -}}
{{- end -}}
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Require Image Signature
    policies.kyverno.io/category: Best Practices (Security)
    policies.kyverno.io/severity: {{ default "high" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Using the Cosign project, OCI images may be signed to ensure supply chain
      security is maintained. Those signatures can be verified before pulling into
      a cluster. This policy checks the signature to ensure it has been signed by verifying
      its signature against the public key.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  matchImageReferences:
    {{- toYaml $matchImageReferences | nindent 4 }}
  attestors:
    {{- toYaml $attestors | nindent 4 }}
  {{- if $credentials }}
  credentials:
    {{- toYaml $credentials | nindent 4 }}
  {{- end }}
  {{- if $validationConfigurations }}
  validationConfigurations:
    {{- toYaml $validationConfigurations | nindent 4 }}
  {{- end }}
  {{/* verifyImageSignatures takes a list of attestor objects, but the `attestors`
       CEL variable is a map keyed by name. Build a list literal of name lookups
       at template time so the expression matches the function's overload. */}}
  {{- $attestorRefs := list -}}
  {{- range $a := $attestors -}}{{- $attestorRefs = append $attestorRefs (printf "attestors[%s]" ($a.name | toJson)) -}}{{- end -}}
  {{- $attestorList := printf "[%s]" (join ", " $attestorRefs) }}
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, {{ $attestorList }})).all(c, c > 0)
      message: "Container image signature verification failed."
    - expression: >-
        images.initContainers.map(image, verifyImageSignatures(image, {{ $attestorList }})).all(c, c > 0)
      message: "Init container image signature verification failed."
    - expression: >-
        images.ephemeralContainers.map(image, verifyImageSignatures(image, {{ $attestorList }})).all(c, c > 0)
      message: "Ephemeral container image signature verification failed."
{{- end -}}
