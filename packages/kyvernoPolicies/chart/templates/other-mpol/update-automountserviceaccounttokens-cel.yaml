{{- $name := "update-automountserviceaccounttokens-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $serviceAccountTargets := list }}
{{- $podAllowTargets := list }}
{{- $podDenyTargets := list }}
{{- $podName := "object.metadata.?name.orValue(object.metadata.?generateName.orValue(\"\"))" }}
{{- range $entry := (dig $name "namespaces" nil .Values.celPoliciesBeta | default (list)) }}
  {{- $namespace := $entry.namespace }}
  {{- range $sa := ($entry.serviceAccounts | default (list)) }}
    {{- $pattern := printf "^%s$" $sa }}
    {{- $serviceAccountTargets = append $serviceAccountTargets (printf "(object.metadata.namespace == %q && object.metadata.name.matches(%q))" $namespace $pattern) }}
  {{- end }}
  {{- range $pod := (dig "pods" "allow" nil $entry | default (list)) }}
    {{- $pattern := printf "^%s$" $pod }}
    {{- $podAllowTargets = append $podAllowTargets (printf "(object.metadata.namespace == %q && %s.matches(%q))" $namespace $podName $pattern) }}
  {{- end }}
  {{- range $pod := (dig "pods" "deny" nil $entry | default (list)) }}
    {{- $pattern := printf "^%s$" $pod }}
    {{- $podDenyTargets = append $podDenyTargets (printf "(object.metadata.namespace == %q && %s.matches(%q))" $namespace $podName $pattern) }}
  {{- end }}
{{- end }}
{{- $serviceAccountExpr := join " || " $serviceAccountTargets }}
{{- /* Unused-branch lists collapse to CEL `false` so one rendered expression
       covers allow-only, deny-only, and both configurations. */}}
{{- $podAllowExpr := ternary (join " || " $podAllowTargets) "false" (gt (len $podAllowTargets) 0) }}
{{- $podDenyExpr := ternary (join " || " $podDenyTargets) "false" (gt (len $podDenyTargets) 0) }}
{{- if and (eq (len $serviceAccountTargets) 0) (eq (len $podAllowTargets) 0) (eq (len $podDenyTargets) 0) }}
{{- fail (printf "%s is enabled but celPoliciesBeta.%s.namespaces has no actionable targets - disable the policy or provide serviceAccounts, pods.allow, or pods.deny entries" $name $name) }}
{{- end }}
{{- if gt (len $serviceAccountTargets) 0 }}
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ $name }}-serviceaccounts
  annotations:
    policies.kyverno.io/title: Disable automountServiceAccountToken for ServiceAccounts
    policies.kyverno.io/category: Other, EKS Best Practices
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: ServiceAccount
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      This policy disables automounting Kubernetes API credentials on the configured
      ServiceAccounts.
    policies.bigbang.dev/lifecycle: beta
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ include "bb-kyverno-policies.mpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["serviceaccounts"]
  {{- $saNsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) }}
  {{- $saUserConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta }}
  matchConditions:
    # Why-not-what: the legacy ClusterPolicy explicitly excluded the namespace
    # default ServiceAccount. Keep that carve-out during migration so the new
    # MPol does not silently broaden scope and start mutating a high-frequency
    # builtin object operators typically leave alone.
    - name: exclude-default-serviceaccount
      expression: object.metadata.name != "default"
    - name: scope-to-configured-serviceaccounts
      expression: |
        {{ $serviceAccountExpr }}
    {{- if $saNsExclude }}
    {{- $saNsExclude | nindent 4 }}
    {{- end }}
    {{- with $saUserConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            automountServiceAccountToken: false
          }
{{- end }}
{{- if or (gt (len $podAllowTargets) 0) (gt (len $podDenyTargets) 0) }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Configure Pod automountServiceAccountToken
    policies.kyverno.io/category: Other, EKS Best Practices
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      This policy disables automounting Kubernetes API credentials for configured Pods
      and re-enables it for listed Pod exceptions which require API access.
    policies.bigbang.dev/lifecycle: beta
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ include "bb-kyverno-policies.mpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) }}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta }}
  matchConditions:
    - name: scope-to-configured-pods
      expression: |
        ({{ $podAllowExpr }}) || ({{ $podDenyExpr }})
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              automountServiceAccountToken: ({{ $podDenyExpr }}) ? false : true
            }
          }
{{- end }}
{{- if gt (len $podAllowTargets) 0 }}
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ $name }}-exception
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  policyRefs:
  - name: disallow-auto-mount-service-account-token-cel
    kind: ValidatingPolicy
  matchConditions:
  - name: automount-allow-pods
    expression: >-
      {{ $podAllowExpr }}
{{- end }}
{{- end -}}
