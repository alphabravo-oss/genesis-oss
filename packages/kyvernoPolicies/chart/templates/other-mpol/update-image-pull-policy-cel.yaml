{{- $name := "update-image-pull-policy-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $update := dig $name "parameters" "update" (list (dict "to" "Always")) .Values.celPoliciesBeta -}}
{{- $valid := list "Always" "Never" "IfNotPresent" -}}
{{- range $u := $update -}}
  {{- if not (hasKey $u "to") -}}
    {{- fail (printf "%s: each parameters.update entry must set 'to'" $name) -}}
  {{- end -}}
  {{- if not (has $u.to $valid) -}}
    {{- fail (printf "%s: parameters.update[].to must be one of Always, Never, IfNotPresent (got %q)" $name $u.to) -}}
  {{- end -}}
{{- end -}}
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Add imagePullPolicy Always
    policies.kyverno.io/category: Helper
    policies.kyverno.io/severity: {{ default "low" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      If mutable tags (e.g. latest) are used for images, it may be desirable to to have the
      `imagePullPolicy` set to `Always` to ensure that future pulls will get the latest
      image. This policy adds or modifies the `imagePullPolicy` to set it to `Always` on
      all tagged images.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://repo1.dso.mil/big-bang/product/packages/kyverno-policies
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ include "bb-kyverno-policies.mpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.cel-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.cel-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  mutations:
  {{- /* Only tagged (non-digest) images are mutated, matching the CPol's `!*@*`
         anchor. An empty `from` rewrites every tagged image; a set `from` only
         rewrites containers whose current imagePullPolicy equals it. Later
         update entries see earlier mutations, so the last matching entry wins. */ -}}
  {{- range $u := $update }}
  {{- $cond := "!c.image.contains(\"@\")" }}
  {{- if $u.from }}
  {{- $cond = printf "%s && c.?imagePullPolicy.orValue(\"\") == %q" $cond $u.from }}
  {{- end }}
  {{- include "update-image-pull-policy-cel.mutation" (dict "field" "containers"          "cond" $cond "to" $u.to "guard" false) }}
  {{- include "update-image-pull-policy-cel.mutation" (dict "field" "initContainers"      "cond" $cond "to" $u.to "guard" true) }}
  {{- include "update-image-pull-policy-cel.mutation" (dict "field" "ephemeralContainers" "cond" $cond "to" $u.to "guard" true) }}
  {{- end }}
{{- end -}}
{{- define "update-image-pull-policy-cel.mutation" -}}
{{- $inner := printf "object.spec.%s.filter(c, %s).map(c, Object.spec.%s{name: c.name, imagePullPolicy: %q})" .field .cond .field .to -}}
{{- $expr := printf "Object{spec: Object.spec{%s: %s}}" .field $inner -}}
{{- if .guard -}}
{{- $expr = printf "has(object.spec.%s) ? %s : Object{}" .field $expr -}}
{{- end }}
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          {{ $expr }}
{{- end -}}
