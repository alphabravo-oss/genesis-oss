{{- $name := "update-automountserviceaccounttokens-default-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
{{- $namespaces := (dig $name "namespaces" nil .Values.celPoliciesBeta | default (list)) }}
{{- if eq (len $namespaces) 0 }}
{{- fail (printf "%s is enabled but celPoliciesBeta.%s.namespaces is empty - disable the policy or list the namespaces whose default ServiceAccount should have automounting disabled" $name $name) }}
{{- end }}
{{- $severity := default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
# Admission half: mutates the default ServiceAccount the moment it is created
# (e.g. with each new namespace), with no delay. Pairs with the mutate-existing
# half below, which retrofits default ServiceAccounts that already existed.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Disable automountServiceAccountToken on default ServiceAccounts
    policies.kyverno.io/category: Other, EKS Best Practices
    policies.kyverno.io/severity: {{ $severity }}
    policies.kyverno.io/subject: ServiceAccount
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      A new ServiceAccount called `default` is created in every Namespace, and Pods that
      don't name a ServiceAccount get it. This policy disables automounting of the API
      token on the `default` ServiceAccount as it is created in the configured namespaces.
    policies.bigbang.dev/lifecycle: beta
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ include "bb-kyverno-policies.mpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE"]
        resources:   ["serviceaccounts"]
        resourceNames: ["default"]
  matchConditions:
    - name: scope-to-configured-namespaces
      expression: object.metadata.namespace in {{ $namespaces | toJson }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            automountServiceAccountToken: false
          }
---
# Mutate-existing half: a default ServiceAccount admission anywhere (e.g. one
# created with a new namespace, or an update to an existing one) triggers this
# policy, which then patches every default ServiceAccount in the configured
# namespaces - including ones that already existed. Mutation is asynchronous.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ $name }}-existing
  annotations:
    policies.kyverno.io/title: Disable automountServiceAccountToken on existing default ServiceAccounts
    policies.kyverno.io/category: Other, EKS Best Practices
    policies.kyverno.io/severity: {{ $severity }}
    policies.kyverno.io/subject: ServiceAccount
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Retrofits default ServiceAccounts that already exist in the configured namespaces,
      disabling automounting of the API token. Complements the admission policy, which
      handles default ServiceAccounts as they are created.
    policies.bigbang.dev/lifecycle: beta
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ include "bb-kyverno-policies.mpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.cel-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.cel-background" (merge (dict "name" $name) .) }}
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["serviceaccounts"]
        resourceNames: ["default"]
  targetMatchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          {{- range $namespaces }}
            - {{ . | quote }}
          {{- end }}
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["serviceaccounts"]
        resourceNames: ["default"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            automountServiceAccountToken: false
          }
{{- end -}}
