# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Upstream: kyverno/policies best-practices-vpol/disallow-privileged-containers
# BB divergences:
#   - images swapped to registry1 ubi9-micro:9.7 (Iron Bank requirement)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-privileged-containers-cel
spec:
  timeouts:
    cleanup: 2m
  steps:
  - name: step-01
    try:
    - apply:
        file: ../policy.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: disallow-privileged-containers-cel
          spec:
            validationActions:
             - Deny
            matchConditions:
              - name: scope-to-test-ns
                expression: (cel; "object.metadata.namespace == '" + string(bindings.resolve("namespace")) + "'")
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        dryRun: true
        expect:
        - check:
            ($error != null): true
            (contains($error, 'validate.kyverno.svc')): true
            (contains($error, 'disallow-privileged-containers-cel')): true
        file: pod-bad.yaml
    # Skip the live bad Deployment deny here. This path has been flaky under
    # Chainsaw retries, while `kyverno test` already proves the autogen deny.
    - apply:
        dryRun: true
        file: pod-good.yaml
    - apply:
        dryRun: true
        file: podcontroller-good.yaml
