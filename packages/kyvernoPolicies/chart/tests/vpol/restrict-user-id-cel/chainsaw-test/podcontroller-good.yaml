apiVersion: apps/v1
kind: Deployment
metadata:
  name: gooddeployment-allowed-user-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allowed-user-id
  template:
    metadata:
      labels:
        app: allowed-user-id
    spec:
      containers:
      - name: container01
        image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.7
        securityContext:
          runAsUser: 1001
