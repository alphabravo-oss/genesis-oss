# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# BB policy: restrict-host-path-mount-pv-cel
# Verifies that PersistentVolumes with disallowed hostPath paths are rejected by admission.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-host-path-mount-pv-cel
spec:
  timeouts:
    cleanup: 2m
  steps:
  - name: step-01
    try:
    - apply:
        file: ../policy.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: restrict-host-path-mount-pv-cel
          spec:
            validationActions:
             - Deny
            matchConditions:
              - name: scope-to-test-pvs
                expression: "object.metadata.name.startsWith('chainsaw-restrict-host-path-mount-pv-')"
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        dryRun: true
        expect:
        - check:
            ($error != null): true
            (contains($error, 'validate.kyverno.svc')): true
            (contains($error, 'restrict-host-path-mount-pv-cel')): true
        file: pv-bad.yaml
    - apply:
        dryRun: true
        file: pv-good.yaml
