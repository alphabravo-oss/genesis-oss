# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# BB policy: require-labels-cel
# Verifies that Pods missing required labels are rejected by admission.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-labels-cel
spec:
  timeouts:
    cleanup: 2m
  steps:
  - name: step-01
    try:
    - apply:
        file: ../policy.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: require-labels-cel
          spec:
            validationActions:
             - Deny
            matchConditions:
              - name: scope-to-test-ns
                expression: (cel; "object.metadata.namespace == '" + string(bindings.resolve("namespace")) + "'")
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        dryRun: true
        expect:
        - check:
            ($error != null): true
            (contains($error, 'validate.kyverno.svc')): true
            (contains($error, 'require-labels-cel')): true
        file: pod-bad.yaml
    # Skip the live bad Deployment deny here. This path has been flaky under
    # Chainsaw retries, while `kyverno test` already proves the autogen deny.
    - apply:
        dryRun: true
        file: pod-good.yaml
    - apply:
        dryRun: true
        file: podcontroller-good.yaml
