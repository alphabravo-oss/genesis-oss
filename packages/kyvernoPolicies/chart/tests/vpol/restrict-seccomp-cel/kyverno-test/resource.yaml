apiVersion: v1
kind: Pod
metadata:
  name: badpod-pod-level-unconfined
spec:
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
  - name: container01
    image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-container-unconfined
