# Kubernetes RBAC escalation admission checks roleRef permissions before Kyverno
# evaluates the binding. Keep this role tiny and test-owned so both direct
# chainsaw and in-cluster Helm test runners can bind it without depending on
# chart-level bbtest fixtures.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: disallow-rbac-on-default-serviceaccounts-test-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
