###### Pods - Bad
---
# no security context anywhere — defaults to root
apiVersion: v1
kind: Pod
metadata:
  name: badpod-no-context
spec:
  containers:
  - name: container01
    image: dummyimagename
---
# container overrides runAsNonRoot to false, no runAsUser fallback
apiVersion: v1
kind: Pod
metadata:
  name: badpod-container-nonroot-false
spec:
  securityContext:
    runAsNonRoot: true
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      runAsNonRoot: false
---
# initContainer overrides runAsNonRoot to false
apiVersion: v1
kind: Pod
metadata:
  name: badpod-init-nonroot-false
spec:
  securityContext:
    runAsNonRoot: true
  containers:
  - name: container01
    image: dummyimagename
  initContainers:
  - name: init01
    image: dummyimagename
    securityContext:
      runAsNonRoot: false
---
# container overrides runAsUser to 0, no runAsNonRoot fallback
apiVersion: v1
kind: Pod
metadata:
  name: badpod-container-user-zero
spec:
  securityContext:
    runAsUser: 1000
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      runAsUser: 0
---
# initContainer overrides runAsUser to 0
apiVersion: v1
kind: Pod
metadata:
  name: badpod-init-user-zero
spec:
  securityContext:
    runAsUser: 1000
  containers:
  - name: container01
    image: dummyimagename
  initContainers:
  - name: init01
    image: dummyimagename
    securityContext:
      runAsUser: 0
---
# pod-level runAsNonRoot=false and runAsUser=0
apiVersion: v1
kind: Pod
metadata:
  name: badpod-pod-both-bad
spec:
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
  containers:
  - name: container01
    image: dummyimagename
---
# one container good, other bad (partial)
apiVersion: v1
kind: Pod
metadata:
  name: badpod-partial
spec:
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      runAsNonRoot: true
  - name: container02
    image: dummyimagename
---
###### Pods - Good
---
# pod-level runAsNonRoot=true, containers inherit
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-nonroot-true
spec:
  securityContext:
    runAsNonRoot: true
  containers:
  - name: container01
    image: dummyimagename
  initContainers:
  - name: init01
    image: dummyimagename
---
# pod-level runAsUser > 0, containers inherit
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-user-nonzero
spec:
  securityContext:
    runAsUser: 1000
  containers:
  - name: container01
    image: dummyimagename
  initContainers:
  - name: init01
    image: dummyimagename
---
# no pod-level, each container sets runAsNonRoot=true
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-container-nonroot
spec:
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      runAsNonRoot: true
  initContainers:
  - name: init01
    image: dummyimagename
    securityContext:
      runAsNonRoot: true
---
# no pod-level, each container sets runAsUser > 0
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-container-user
spec:
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      runAsUser: 1000
  initContainers:
  - name: init01
    image: dummyimagename
    securityContext:
      runAsUser: 1000
---
# mixed: container uses runAsNonRoot, init uses runAsUser
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-mixed
spec:
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      runAsNonRoot: true
  initContainers:
  - name: init01
    image: dummyimagename
    securityContext:
      runAsUser: 1000
---
# container overrides runAsNonRoot=false but has runAsUser > 0
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-nonroot-false-user-ok
spec:
  securityContext:
    runAsNonRoot: true
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      runAsNonRoot: false
      runAsUser: 1000
---
###### Deployments - Bad
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baddeployment-no-context
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: container01
        image: dummyimagename
---
###### Deployments - Good
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gooddeployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: container01
        image: dummyimagename
