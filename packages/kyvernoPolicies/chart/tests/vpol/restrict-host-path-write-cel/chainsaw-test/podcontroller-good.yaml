apiVersion: apps/v1
kind: Deployment
metadata:
  name: gooddeployment-hostpath-readonly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: container01
          image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal
          volumeMounts:
          - name: host
            mountPath: /host-etc
            readOnly: true
      volumes:
      - name: host
        hostPath:
          path: /etc
