apiVersion: v1
kind: Pod
metadata:
  name: goodpod-hostpath-readonly
spec:
  containers:
  - name: container01
    image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal
    volumeMounts:
    - name: host
      mountPath: /host-etc
      readOnly: true
  volumes:
  - name: host
    hostPath:
      path: /etc
