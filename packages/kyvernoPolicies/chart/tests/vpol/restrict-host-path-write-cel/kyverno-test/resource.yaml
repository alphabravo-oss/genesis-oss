apiVersion: v1
kind: Pod
metadata:
  name: badpod-hostpath-writable
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
    volumeMounts:
    - name: host
      mountPath: /host-etc
  volumes:
  - name: host
    hostPath:
      path: /etc
