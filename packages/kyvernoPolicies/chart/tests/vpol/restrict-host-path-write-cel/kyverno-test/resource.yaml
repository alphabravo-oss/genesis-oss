###### Pods - Good
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-no-volumes
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-no-hostpath
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
    volumeMounts:
    - name: cfg
      mountPath: /cfg
    - name: scratch
      mountPath: /scratch
  volumes:
  - name: cfg
    configMap:
      name: example
  - name: scratch
    emptyDir: {}
---
