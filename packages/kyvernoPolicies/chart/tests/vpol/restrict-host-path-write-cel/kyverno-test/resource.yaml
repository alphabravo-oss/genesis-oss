###### Deployments - Bad
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baddeployment-hostpath-writable
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: c1
        image: nginx
        volumeMounts:
        - name: host
          mountPath: /host-etc
      volumes:
      - name: host
        hostPath:
          path: /etc
---
###### Deployments - Good
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gooddeployment-hostpath-readonly
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: c1
        image: nginx
        volumeMounts:
        - name: host
          mountPath: /host-etc
          readOnly: true
      volumes:
      - name: host
        hostPath:
          path: /etc
