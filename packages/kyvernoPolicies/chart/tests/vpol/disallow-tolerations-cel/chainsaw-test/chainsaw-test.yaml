apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-tolerations-cel
spec:
  timeouts:
    cleanup: 2m
  steps:
  - name: step-01-policy-ready
    try:
    - apply:
        file: ../policy.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: disallow-tolerations-cel
          spec:
            validationActions:
             - Deny
            matchConditions:
              - name: scope-to-test-ns
                expression: (cel; "object.metadata.namespace == '" + string(bindings.resolve("namespace")) + "'")
    # RuntimeClass is cluster-scoped, so scope by name prefix to keep parallel
    # chainsaw runs from stepping on each other.
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: disallow-tolerations-cel-runtimeclass
          spec:
            validationActions:
             - Deny
            matchConditions:
              - name: scope-to-test-name
                expression: "object.metadata.name.startsWith('disallow-tolerations-')"
    - assert:
        file: policy-ready.yaml
    - assert:
        file: policy-ready-runtimeclass.yaml
  - name: step-02-pod-deny
    try:
    - apply:
        dryRun: true
        expect:
        - check:
            ($error != null): true
            (contains($error, 'validate.kyverno.svc')): true
            (contains($error, 'disallow-tolerations-cel')): true
        file: pod-bad.yaml
  - name: step-03-pod-allow
    try:
    - apply:
        dryRun: true
        file: pod-good.yaml
  - name: step-04-runtimeclass-deny
    try:
    - apply:
        dryRun: true
        expect:
        - check:
            ($error != null): true
            (contains($error, 'validate.kyverno.svc')): true
            (contains($error, 'disallow-tolerations-cel-runtimeclass')): true
        file: runtimeclass-bad.yaml
  - name: step-05-runtimeclass-allow
    try:
    - apply:
        dryRun: true
        file: runtimeclass-good.yaml
