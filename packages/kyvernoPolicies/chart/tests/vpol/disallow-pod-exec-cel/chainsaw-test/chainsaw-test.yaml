apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-pod-exec-cel
spec:
  timeouts:
    cleanup: 2m
  steps:
  - name: step-01
    try:
    - apply:
        file: ../policy.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: disallow-pod-exec-cel
          spec:
            validationActions:
             - Deny
            matchConditions:
              - name: scope-to-test-ns
                expression: (cel; "request.namespace == '" + string(bindings.resolve("namespace")) + "'")
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    # Copy the private-registry imagePullSecret from the kyverno namespace
    # (where Helm installed it) into this chainsaw test namespace so the
    # target pod can pull from registry1.
    - script:
        content: |
          set -e
          kubectl get secret private-registry -n kyverno -o json \
            | jq '.metadata = {name: .metadata.name}' \
            | kubectl apply -n "$NAMESPACE" -f -
        env:
        - name: NAMESPACE
          value: ($namespace)
    - apply:
        file: pod.yaml
    - wait:
        apiVersion: v1
        kind: Pod
        name: disallow-pod-exec-target-pod
        timeout: 2m
        for:
          condition:
            name: Ready
            value: "true"
  - name: step-03
    try:
    - script:
        content: |
          set +e
          OUT=$(kubectl exec -n "$NAMESPACE" disallow-pod-exec-target-pod -- echo hi 2>&1)
          STATUS=$?
          echo "$OUT"
          if [ $STATUS -eq 0 ]; then
            echo "ERROR: expected exec to be denied, but it succeeded"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'disallow-pod-exec-cel'; then
            echo "ERROR: expected denial mentioning disallow-pod-exec-cel, got: $OUT"
            exit 1
          fi
        env:
        - name: NAMESPACE
          value: ($namespace)
