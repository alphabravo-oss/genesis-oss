apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-probes-cel
policies:
- ../policy.yaml
resources:
- resource.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: require-probes-cel
  resources:
  - badpod-no-probes
  - badpod-missing-readiness
  - badpod-missing-liveness
  - badpod-partial
  result: fail
- isValidatingPolicy: true
  kind: Deployment
  policy: require-probes-cel
  resources:
  - baddeployment-no-probes
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: require-probes-cel
  resources:
  - goodpod-both-probes
  - goodpod-init-exempt
  - goodpod-multi-container
  result: pass
- isValidatingPolicy: true
  kind: Deployment
  policy: require-probes-cel
  resources:
  - gooddeployment
  result: pass
