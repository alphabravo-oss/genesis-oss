apiVersion: v1
kind: Pod
metadata:
  name: pod-bad-unequal-cpu
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "64Mi"
