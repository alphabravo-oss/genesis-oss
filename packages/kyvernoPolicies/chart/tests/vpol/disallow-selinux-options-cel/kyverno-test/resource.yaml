###### Pods - Bad
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-user-pod-level
spec:
  securityContext:
    seLinuxOptions:
      user: disallowed
  containers:
  - name: container01
    image: dummyimagename
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-role-container
spec:
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      seLinuxOptions:
        role: disallowed
---
