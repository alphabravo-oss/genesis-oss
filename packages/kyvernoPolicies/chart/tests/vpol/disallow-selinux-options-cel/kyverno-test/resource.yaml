    securityContext:
      seLinuxOptions:
        user: disallowed
  containers:
  - name: container01
    image: dummyimagename
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-role-pod-and-container
spec:
  securityContext:
    seLinuxOptions:
      role: disallowed
  containers:
  - name: container01
    image: dummyimagename
    securityContext:
      seLinuxOptions:
        role: disallowed
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-role-ephemeral
spec:
  containers:
  - name: container01
    image: dummyimagename
  ephemeralContainers:
  - name: debug01
    image: dummyimagename
    securityContext:
      seLinuxOptions:
        role: disallowed
