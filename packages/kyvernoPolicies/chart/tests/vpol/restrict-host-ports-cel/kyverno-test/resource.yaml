###### Pods - Bad (hostPort outside the allowed ranges)
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-container-hostport
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
    ports:
    - containerPort: 80
      hostPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-initcontainer-hostport
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
  initContainers:
  - name: init1
    image: nginx
    ports:
    - containerPort: 8080
      hostPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-ephemeralcontainer-hostport
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
  ephemeralContainers:
  - name: debug1
    image: nginx
    ports:
    - containerPort: 443
      hostPort: 443
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-gap-hostport
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
    ports:
    - containerPort: 8080
      hostPort: 65000
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod-multiple-ports
  namespace: default
spec:
  containers:
  - name: c1
    image: nginx
    ports:
    - containerPort: 8080
      hostPort: 64500
    - containerPort: 9090
      hostPort: 9090
---
