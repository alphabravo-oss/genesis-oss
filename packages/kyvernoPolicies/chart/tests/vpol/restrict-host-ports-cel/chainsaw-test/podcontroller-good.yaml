apiVersion: apps/v1
kind: Deployment
metadata:
  name: gooddeployment-allowed-hostport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: container01
          image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal
          ports:
          - containerPort: 8080
            hostPort: 64000
