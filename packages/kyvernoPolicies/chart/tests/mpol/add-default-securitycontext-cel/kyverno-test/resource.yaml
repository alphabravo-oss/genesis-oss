# Mutation-oriented input fixtures for offline `kyverno test`.
# The sibling Chainsaw test asserts the explicit post-mutation object shape.
# Pod with no securityContext — all four fields should get defaults
apiVersion: v1
kind: Pod
metadata:
  name: bare-pod
  namespace: default
spec:
  containers:
    - name: test
      image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.7
---
# Pod with partial securityContext — only missing fields should get defaults
apiVersion: v1
kind: Pod
metadata:
  name: partial-pod
  namespace: default
spec:
  securityContext:
    runAsNonRoot: false
    runAsUser: 1000
  containers:
    - name: test
      image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.7
---
# Pod with full securityContext — no mutation expected
apiVersion: v1
kind: Pod
metadata:
  name: full-pod
  namespace: default
spec:
  securityContext:
    runAsNonRoot: false
    runAsUser: 1000
    runAsGroup: 2000
    fsGroup: 3000
  containers:
    - name: test
      image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.7
