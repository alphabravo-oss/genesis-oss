apiVersion: v1
kind: Pod
metadata:
  name: registry-pod
  namespace: default
spec:
  containers:
    - name: test
      image: replace.image.registry/ironbank/redhat/ubi/ubi9-minimal:9.7
  initContainers:
    - name: init
      image: replace.image.registry/ironbank/redhat/ubi/ubi9-minimal:9.7
  ephemeralContainers:
    - name: debug
      image: replace.image.registry/ironbank/redhat/ubi/ubi9-minimal:9.7
      targetContainerName: test
---
# Image already on the target registry -> left untouched (no `from` substring)
apiVersion: v1
kind: Pod
metadata:
  name: untouched-pod
  namespace: default
spec:
  containers:
    - name: test
      image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.7
---
# Controller pod template is rewritten via autogen (ApplyConfiguration rewrites
# object.spec -> object.spec.template.spec). JSONPatch could not do this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: test
          image: replace.image.registry/ironbank/redhat/ubi/ubi9-minimal:9.7
