apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-access-denied-live
  namespace: update-automountserviceaccounttokens-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-access-denied-live
  template:
    metadata:
      labels:
        app: api-access-denied-live
    spec:
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
      containers:
        - name: test
          image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-micro:9.7
          command: ["true"]
          securityContext:
            capabilities:
              drop:
                - ALL
