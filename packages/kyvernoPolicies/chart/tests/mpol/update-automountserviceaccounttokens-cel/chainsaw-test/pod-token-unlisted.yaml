# Not in the allow/deny lists, so the MPol leaves its automountServiceAccountToken
# alone and the exception does not cover it — the enforcing VPol must reject it.
apiVersion: v1
kind: Pod
metadata:
  name: unlisted-token-pod
  namespace: update-automountserviceaccounttokens-2
spec:
  automountServiceAccountToken: true
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: test
      image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-micro:9.7
      command: ["true"]
