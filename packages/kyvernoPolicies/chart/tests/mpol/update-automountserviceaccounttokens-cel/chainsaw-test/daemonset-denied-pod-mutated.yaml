# DaemonSet is outside this policy's autogen scope, so a false token here can
# only come from the pod-level rule matching the nameless (generateName) pod.
# Match by label since the pod has no fixed name.
apiVersion: v1
kind: Pod
metadata:
  namespace: update-automountserviceaccounttokens-2
  labels:
    app: api-access-denied-daemon
spec:
  automountServiceAccountToken: false
