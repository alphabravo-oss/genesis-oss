apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: update-automountserviceaccounttokens-default-cel
policies:
- ../policy.yaml
resources:
- resource.yaml
# Only the default SA in a configured namespace is mutated. A non-default SA
# (resourceNames) and a default SA in an unconfigured namespace (matchConditions)
# are asserted as skip, so a scope regression fails the test.
results:
- policy: update-automountserviceaccounttokens-default-cel
  resources:
  - update-automountserviceaccounttokens-default-2/default
  patchedResources: patched.yaml
  kind: ServiceAccount
  result: pass
- policy: update-automountserviceaccounttokens-default-cel
  resources:
  - update-automountserviceaccounttokens-default-2/not-default
  - update-automountserviceaccounttokens-default-unconfigured/default
  kind: ServiceAccount
  result: skip
