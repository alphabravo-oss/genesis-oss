      require-non-root-group:
        enabled: false
      add-default-capability-drop:
        exclude:
          any:
            - resources:
                namespaces:
                  - default
                names:
                  - require-drop-all-capabilities*
        enabled: false
      disallow-annotations:
        parameters:
          disallow:
            - 'kyverno-policies-bbtest/test: disallowed'
            - kyverno-policies-bbtest/disallowed
        enabled: false
      disallow-labels:
        parameters:
          disallow:
            - 'kyverno-policies-bbtest/test: disallowed'
            - kyverno-policies-bbtest/disallowed
        enabled: false
      require-annotations:
        parameters:
          require:
            - 'kyverno-policies-bbtest/test: required'
            - kyverno-policies-bbtest/required
        enabled: false
      require-labels:
        parameters:
          require:
            - 'kyverno-policies-bbtest/test: required'
            - kyverno-policies-bbtest/required
        enabled: false
      restrict-external-ips:
        parameters:
          allow:
            - 192.168.0.1
        enabled: false
      restrict-external-names:
        parameters:
