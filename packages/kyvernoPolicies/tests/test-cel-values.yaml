    celPoliciesBeta:
      add-default-capability-drop-cel:
        enabled: true
      add-default-securitycontext-cel:
        enabled: true
      block-ephemeral-containers-cel:
        enabled: true
        validationFailureAction: Audit
      clone-configs-cel:
        enabled: true
        parameters:
          clone:
            - name: clone-source
              kind: ConfigMap
              namespace: default
      disallow-annotations-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          disallow:
            - key: kyverno-policies-bbtest/disallowed
            - key: kyverno-policies-bbtest/test
              value: disallowed
      disallow-deprecated-apis-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-host-namespaces-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-istio-injection-bypass-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-labels-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          disallow:
            - key: "kyverno-policies-bbtest/disallowed"
            - key: "kyverno-policies-bbtest/test"
              value: disallowed
      disallow-namespaces-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          disallow:
            - bigbang
            - default
      disallow-nodeport-services-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-pod-exec-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-privilege-escalation-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-privileged-containers-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-rbac-on-default-serviceaccounts-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-selinux-options-cel:
        enabled: true
        validationFailureAction: Audit
      disallow-tolerations-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          disallow:
            - key: 'node-role\.kubernetes\.io/master'
            - key: 'taint-with-value'
              value: 'forbidden-value'
            - key: 'taint-with-effect'
              effect: 'PreferNoSchedule'
      require-annotations-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          require:
            - key: app\.kubernetes\.io/name
            - key: app\.kubernetes\.io/version
              value: v1
            - key: app\.kubernetes\.io/component
              value: frontend|backend
      require-cpu-limit-cel:
        enabled: true
        validationFailureAction: Audit
      require-drop-all-capabilities-cel:
        enabled: true
        validationFailureAction: Audit
      require-image-signature-cel:
        enabled: true
        validationFailureAction: Audit
      require-istio-on-namespaces-cel:
        enabled: true
        validationFailureAction: Audit
      require-labels-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          require:
            - key: app\.kubernetes\.io/name
            - key: app\.kubernetes\.io/version
              value: v1
            - key: app\.kubernetes\.io/component
              value: frontend|backend
      require-memory-limit-cel:
        enabled: true
        validationFailureAction: Audit
      require-non-root-group-cel:
        enabled: true
        validationFailureAction: Audit
      require-non-root-user-cel:
        enabled: true
        validationFailureAction: Audit
      require-probes-cel:
        enabled: true
        validationFailureAction: Audit
      restrict-apparmor-cel:
        enabled: true
        validationFailureAction: Audit
      restrict-capabilities-cel:
        enabled: true
        validationFailureAction: Audit
      restrict-proc-mount-cel:
        enabled: true
        validationFailureAction: Audit
      restrict-seccomp-cel:
        enabled: true
        validationFailureAction: Audit
      restrict-selinux-type-cel:
        enabled: true
        validationFailureAction: Audit
      restrict-sysctls-cel:
        enabled: true
        validationFailureAction: Audit
      require-requests-equal-limits-cel:
        enabled: true
        validationFailureAction: Audit
      require-ro-rootfs-cel:
        enabled: true
        validationFailureAction: Audit
      restrict-external-ips-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - 192\.168\.0\.1
      restrict-external-names-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - .*\.allowed\.internal
      restrict-group-id-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - min: 1000
          deny:
            - min: 1500
              max: 1599
      restrict-host-path-mount-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - /tmp/allowed
            - /var/log/.*
      restrict-host-path-mount-pv-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - /tmp/allowed
            - /var/lib/rancher/k3s/storage/pvc-*
      restrict-host-path-write-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - /tmp/allowed
            - /var/log/.*
      restrict-host-ports-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - min: 63999
              max: 63999
            - min: 64000
              max: 64999
            - min: 65001
      restrict-image-registries-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - registry1.dso.mil/
      restrict-user-id-cel:
        enabled: true
        validationFailureAction: Audit
        parameters:
          allow:
            - min: 1000
          deny:
            - min: 1500
              max: 1599
      restrict-volume-types-cel:
        enabled: true
        validationFailureAction: Audit
      update-automountserviceaccounttokens-cel:
        enabled: true
        autogenControllers: Deployment,StatefulSet
        namespaces:
          - namespace: update-automountserviceaccounttokens-2
            serviceAccounts:
              - update-token-automount-2
              - update-token-automount-wild-.*
            pods:
              allow:
                - api-access-allowed-.*
                - api-access-overlap-.*
              deny:
                - api-access-denied-.*
                - api-access-overlap-.*
      update-automountserviceaccounttokens-default-cel:
        enabled: true
        namespaces:
          - update-automountserviceaccounttokens-default-2
      update-image-pull-policy-cel:
        enabled: true
        parameters:
          # Chained config so the live/offline suites exercise the from filter
          # and last-wins ordering, not just an unconditional set. Entry 1
          # forces every tagged image to Never; entry 2 rewrites Never to
          # Always. A tagged image ending at Always proves entry 2's from
          # matched entry 1's output (chaining). Net result still matches the
          # simple fixtures: tagged -> Always, digest -> IfNotPresent.
          update:
            - to: Never
            - from: Never
              to: Always
      update-image-registry-cel:
        enabled: true
        parameters:
          # `from` is an RE2 regex (anchored, escaped dots here). Chained so the
          # suite exercises multi-entry ordering: entry 1 rewrites
          # replace.image.registry -> intermediate.registry, entry 2 rewrites
          # that to registry1.dso.mil. A container image ending at
          # registry1.dso.mil proves entry 2's from matched entry 1's output.
          update:
            - from: '^replace\.image\.registry'
              to: intermediate.registry
            - from: '^intermediate\.registry'
              to: registry1.dso.mil
