#########################
# Disable Core Packages #
#########################
bbctl:
  enabled: false
neuvector:
  enabled: false
tempo:
  enabled: false
kyvernoReporter:
  enabled: false
kiali:
  enabled: false
addons:
########################
# Required for package #
########################
  minioOperator:
    enabled: true
    values:
      bbtests:
        enabled: false

alloy:
  enabled: true
  alloyLogs:
    enabled: true
  values:
    bbtests:
      enabled: true
    upstream:
      collectors:
        alloy-logs:
          enabled: true
          presets:
            - daemonset
            - filesystem-log-reader
          global:
            podSecurityContext:
              fsGroup: 0
        alloy-singleton:
          enabled: true
          presets:
            - singleton
      destinations:
        loki:
          type: loki
          url: http://logging-loki-write.logging.svc.cluster.local:3100/loki/api/v1/push
      podLogsViaLoki:
        enabled: true
        destinations:
          - loki
        collector: alloy-logs
        structuredMetadata:
          k8s.pod.name: k8s.pod.name
          pod: ""
          service.instance.id: service.instance.id
      clusterEvents:
        enabled: true
        destinations:
          - loki
        collector: alloy-singleton
loki:
  enabled: true
  strategy: scalable
  values:
    # MinIO required for Loki Scalable
    minio:
      enabled: true
    write:
      replicas: 3
    read:
      replicas: 3
    backend:
      replicas: 3
    bbtests:
      enabled: true
      scripts:
        envs:
          LOKI_URL: 'http://logging-loki-write.logging.svc:3100'
grafana:
  enabled: true
  values:
    bbtests:
      enabled: false
monitoring:
  enabled: true
  values:
    bbtests:
      enabled: false
kyvernoPolicies:
  values:
    bbtests:
      enabled: false
kyverno:
  values:
    bbtests:
      enabled: false
