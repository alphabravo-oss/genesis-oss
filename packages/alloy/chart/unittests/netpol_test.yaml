suite: test network policies
templates:
  - templates/bigbang/network-policies.yaml
values:
  - values/netpol-values.yaml
tests:
  - it: should create network policies when enabled
    documentSelector:
      path: metadata.name
      value: default-ingress-deny-all
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: default-ingress-deny-all
  - it: should allow prometheus to scrape alloy-receiver metrics
    documentSelector:
      path: metadata.name
      value: allow-ingress-to-alloy-receiver-tcp-port-12345-from-ns-monitoring-pod-prometheus
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 12345
  - it: should allow alloy-metrics to scrape alloy-receiver metrics
    documentSelector:
      path: metadata.name
      value: allow-ingress-to-alloy-receiver-tcp-port-12345-from-ns-alloy-pod-alloy-metrics
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 12345
  - it: should allow OTLP gRPC ingress to alloy-receiver
    documentSelector:
      path: metadata.name
      value: allow-ingress-to-alloy-receiver-tcp-port-4317-from-any-ns-any-pod
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 4317
  - it: should allow Zipkin ingress to alloy-receiver
    documentSelector:
      path: metadata.name
      value: allow-ingress-to-alloy-receiver-tcp-port-9411-from-any-ns-any-pod
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9411
