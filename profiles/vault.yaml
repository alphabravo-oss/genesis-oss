# Optional HashiCorp Vault. Off unless you pass this file.
# Images verified 2026-09-21:
#   docker.io/hashicorp/vault:1.21.4
#   docker.io/hashicorp/vault-k8s:1.7.6
#   docker.io/hashicorp/vault-csi-provider:1.7.4
vault:
  enabled: true
  values:
    bbtests:
      enabled: false
    upstream:
      global:
        imagePullSecrets: []
      injector:
        image:
          repository: docker.io/hashicorp/vault-k8s
          tag: v1.7.6
        agentImage:
          repository: docker.io/hashicorp/vault
          tag: "1.21.4"
      server:
        image:
          repository: docker.io/hashicorp/vault
          tag: "1.21.4"
      csi:
        image:
          repository: docker.io/hashicorp/vault-csi-provider
          tag: v1.7.4
        agent:
          image:
            repository: docker.io/hashicorp/vault
            tag: "1.21.4"
