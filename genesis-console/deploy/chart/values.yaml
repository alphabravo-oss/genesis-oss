image:
  # Release tags publish this image; the tag defaults to the chart's appVersion.
  repository: ghcr.io/alphabravo-oss/genesis-console
  tag: ""
  pullPolicy: IfNotPresent
# Existing Secret in the console namespace: keys database-url and console-password,
# and optionally connection-key (openssl rand -base64 32) to save cluster connections from the UI.
credentialsSecret: genesis-console
# false installs only the read-only service account, its RBAC, and a token Secret,
# for a console running outside this cluster (see scripts/service-account-kubeconfig.sh).
console:
  enabled: true
username: admin
cluster:
  namespace: bigbang
  release: bigbang
  # Helm stores child release revisions in these namespaces. Secret reads are
  # limited to this list plus cluster.namespace; there is no cluster-wide Secret grant.
  releaseNamespaces:
    - istio-system
    - istio-gateway
    - kiali
    - kyverno
    - kyverno-reporter
    - logging
    - tempo
    - monitoring
    - neuvector
    - cert-manager
    - alloy
cache:
  size: 10Gi
  storageClass: ""
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
