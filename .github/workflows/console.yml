name: console

# Tests the console on every change. A console-vX.Y.Z tag publishes the console
# image and chart to GHCR as version X.Y.Z. Console versions are independent of
# Genesis tags, which track Big Bang releases one to one.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["console-v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genesis-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: genesis-console/go.mod
          cache-dependency-path: genesis-console/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: genesis-console/web/.nvmrc
      - run: npm install --global pnpm@11.18.0
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.1
      - name: Go
        run: go vet ./... && go test ./internal/...
      - name: Web
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
      - name: Chart and packaging
        run: |
          helm lint deploy/chart
          helm template t deploy/chart --set console.enabled=false > /dev/null
          python3 scripts/test_package.py

  publish:
    if: startsWith(github.ref, 'refs/tags/console-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#console-v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: genesis-console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genesis-console:${{ env.VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.1
      - name: Chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          chart=$(awk '/^version:/{print $2}' genesis-console/deploy/chart/Chart.yaml)
          if [ "$chart" != "$VERSION" ]; then
            echo "chart version ${chart} does not match tag console-v${VERSION}"
            exit 1
          fi
          helm package genesis-console/deploy/chart --app-version "$VERSION" --destination /tmp/chart
          helm push "/tmp/chart/genesis-console-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
